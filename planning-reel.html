<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vie scolaire · Planning réel</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
[hidden]{display:none!important}:root{font:14px system-ui,sans-serif;color:#202b40;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}.top{background:#fff;border-bottom:1px solid #e2e8f2;padding:20px 26px;display:flex;align-items:center;gap:15px;flex-wrap:wrap}.logo{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:#e8efff;color:#345fc6;font-size:21px}.titles{flex:1}.titles h1{font-size:19px;margin:0}.titles p{margin:3px 0 0;color:#66758d;font-size:12px}.badge{color:#315ba8;background:#edf3ff;border-radius:20px;padding:7px 11px;font-weight:600;font-size:12px}main{max-width:1350px;margin:auto;padding:24px}.toolbar{display:flex;align-items:end;gap:14px;flex-wrap:wrap;margin-bottom:18px}.toolbar label{font-size:12px;color:#68758c;font-weight:650;display:grid;gap:6px}select,button{font:inherit}select{border:1px solid #d7dfeb;background:#fff;color:#253450;border-radius:9px;padding:9px 32px 9px 11px;min-width:190px}.summary{margin-left:auto;color:#65748a;font-size:12px}.card{background:white;border:1px solid #e2e8f1;border-radius:16px;box-shadow:0 6px 18px #263e6710;overflow:hidden}.cardhead{padding:17px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #edf0f5}.cardhead strong{font-size:15px}.cardhead span{font-size:12px;color:#79869a}.scroll{overflow:auto}.grid{min-width:700px;display:grid;grid-template-columns:62px repeat(5,minmax(120px,1fr));position:relative}.day{height:45px;display:grid;place-items:center;font-weight:700;color:#52627b;border-bottom:1px solid #dfe6ef}.day:not(:first-child){border-left:1px solid #edf0f5}.time{height:48px;padding:0 12px 0 0;text-align:right;color:#8592a5;font-size:11px;transform:translateY(-7px)}.lane{height:528px;position:relative;border-left:1px solid #edf0f5;background:repeating-linear-gradient(to bottom,transparent 0,transparent 47px,#edf0f5 47px,#edf0f5 48px)}.block{position:absolute;left:5px;right:5px;border-left:3px solid #4678dc;background:#e9f0ff;border-radius:6px;padding:7px 8px;overflow:hidden;color:#254882;font-size:12px}.block.midi{background:#fff1da;border-color:#e4a137;color:#865411}.block strong,.block small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.block small{margin-top:3px;opacity:.8}.empty{padding:28px;text-align:center;color:#718097}.note{margin:16px 2px;font-size:12px;color:#758298;line-height:1.5}.error{color:#9c4c18}button{background:#fff;color:#4262a0;border:1px solid #d7dfeb;border-radius:9px;padding:9px 13px;cursor:pointer}@media(max-width:600px){main{padding:14px}.top{padding:15px}.summary{width:100%;margin:0}}@media print{body{background:white}.top{padding:8px 0}.toolbar button,.badge,.note{display:none}.card{box-shadow:none;border:0}.scroll{overflow:visible}.grid{min-width:0}.block{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body><header class="top"><div class="logo">▦</div><div class="titles"><h1>Planning réel de l’équipe AED</h1><p>Vie scolaire · Vue hebdomadaire</p></div><span class="badge" id="status">En attente de Grist</span></header><main><div class="toolbar"><label id="weeklabel" hidden>Semaine<select id="week"></select></label><label>Afficher le planning de<select id="person"><option value="">Toute l’équipe</option></select></label><div class="summary" id="summary"></div><button id="print" type="button">Imprimer</button></div><section class="card"><div class="cardhead"><strong>Emploi du temps</strong><span>Du lundi au vendredi · 7h30 – 18h30</span></div><div class="scroll"><div id="calendar"></div></div></section><p class="note" id="note">Prototype en lecture seule : les horaires affichés proviennent du jeu fictif. Les modifications se font dans la table Grist associée.</p></main>
<script>
'use strict';
const sample=[{id:1,A:'Lundi 08:00–10:00',B:'Camille Exemple',C:'Étude'},{id:2,A:'Lundi 11:35–13:30',B:'Morgan Exemple',C:'Midi'}];
const days=['Lundi','Mardi','Mercredi','Jeudi','Vendredi']; let records=[]; let connected=false;
const $=x=>document.getElementById(x); const escapeHtml=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function formatDate(value){
 if(typeof value==='number'){const d=new Date(value*1000);return Number.isNaN(d.getTime())?String(value):d.toLocaleDateString('fr-FR',{timeZone:'UTC'});}
 const s=String(value??'');const m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[3]}/${m[2]}/${m[1]}`:s;
}
function parse(r){
 let day,start,end,person,post,week='';
 if(r.semaine_source_id!==undefined || r.lundi!==undefined){
  const m=String(r.debut??'').match(/^(\d{1,2}):(\d{2})$/), n=String(r.fin??'').match(/^(\d{1,2}):(\d{2})$/);
  day=days.findIndex(d=>d.toLowerCase()===String(r.jour??'').toLowerCase());
  if(!m||!n||+m[2]>59||+n[2]>59)return null;
  start=+m[1]*60+(+m[2]);end=+n[1]*60+(+n[2]);
  person=String(r.aed_nom||r.aed_source_id||'');post=String(r.poste_nom||r.poste_source_id||'');week=String(r.semaine_source_id??r.lundi??'');
 }else{
  const text=String(r.A??r.Creneau??r['Créneau']??'');const m=text.match(/^(Lundi|Mardi|Mercredi|Jeudi|Vendredi)\s+(\d{1,2}):(\d{2})\s*[-–—]\s*(\d{1,2}):(\d{2})$/i);
  if(!m||+m[3]>59||+m[5]>59)return null;day=days.findIndex(d=>d.toLowerCase()===m[1].toLowerCase());start=+m[2]*60+(+m[3]);end=+m[4]*60+(+m[5]);person=String(r.B??r.AED??'');post=String(r.C??r.Poste??'');
 }
 if(day<0||start<450||end>1110||start>=end||start%5!==0||end%5!==0)return null;return {id:r.id,day,start,end,person,post,week,weekLabel:String(r.semaine_nom||(r.lundi!==undefined ? 'Dérogation · '+formatDate(r.lundi) : week))};
}
function render(){
 const ws=$('week'), old=ws.value;
 const weeks=records.filter(r=>r.lundi!==undefined && r.planning_json!==undefined).map(r=>{try{return {key:String(r.lundi),label:formatDate(r.lundi),data:JSON.parse(r.planning_json)}}catch(e){return {key:String(r.lundi),label:formatDate(r.lundi),data:{erreur:'Données de planning illisibles',creneaux:[]}}}}).sort((a,b)=>a.key.localeCompare(b.key));
 $('weeklabel').hidden=false; ws.innerHTML=weeks.map(w=>`<option value="${escapeHtml(w.key)}">${escapeHtml(w.label)}${w.data.origine==='Dérogation'?' · modifiée':''}</option>`).join('');
 ws.value=weeks.some(w=>w.key===old)?old:(weeks[0]?.key||'');
 const selected=weeks.find(w=>w.key===ws.value), data=selected?.data || {creneaux:[]};
 const parsed=(data.creneaux||[]).map(x=>parse({...x,semaine_source_id:ws.value})), valid=parsed.filter(Boolean);
 const sel=$('person'),oldPerson=sel.value,people=[...new Set(valid.map(x=>x.person).filter(Boolean))].sort();
 sel.innerHTML='<option value="">Toute l’équipe</option>'+people.map(p=>`<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('');sel.value=people.includes(oldPerson)?oldPerson:'';
 const rows=sel.value?valid.filter(x=>x.person===sel.value):valid;let html='<div class="grid"><div class="day"></div>'+days.map(d=>`<div class="day">${d}</div>`).join('')+'<div class="axis">';
 for(let i=0;i<11;i++){let min=450+i*60;html+=`<div class="time">${Math.floor(min/60)}h${String(min%60).padStart(2,'0')}</div>`}html+='</div>';
 for(let d=0;d<5;d++){html+='<div class="lane">';const dayRows=rows.filter(x=>x.day===d).sort((a,b)=>a.start-b.start||a.end-b.end),columns=[];
 for(const x of dayRows){let col=columns.findIndex(end=>end<=x.start);if(col<0){col=columns.length;columns.push(x.end)}else columns[col]=x.end;x.column=col}const total=columns.length||1;
 for(const x of dayRows){const top=(x.start-450)*.8,height=(x.end-x.start)*.8,hrs=n=>`${Math.floor(n/60)}h${String(n%60).padStart(2,'0')}`;html+=`<div class="block ${/midi/i.test(x.post)?'midi':''}" style="top:${top}px;height:${height}px;left:calc(${x.column*100/total}% + 3px);width:calc(${100/total}% - 6px);right:auto" title="${escapeHtml(x.person+' · '+x.post)}"><strong>${escapeHtml(x.post||'Poste')}</strong><small>${escapeHtml(x.person)} · ${hrs(x.start)}–${hrs(x.end)}</small></div>`}html+='</div>'}html+='</div>';
 $('calendar').innerHTML=html;$('summary').textContent=`${rows.length} créneau${rows.length===1?'':'x'} affiché${rows.length===1?'':'s'}`;
 let errors=[data.erreur,parsed.length!==valid.length?'Des créneaux comportent des horaires invalides.':''].filter(Boolean);
 $('note').textContent=errors.length?errors.join(' · '):selected?`${data.origine} · Lecture seule${data.origine==='Dérogation'&& !rows.length?' · Cette semaine modifiée ne contient aucun créneau.':''}`:'Aucune semaine disponible.';$('note').className=errors.length?'note error':'note';
}
$('person').addEventListener('change',render);$('week').addEventListener('change',render);$('print').addEventListener('click',()=>window.print());render();
if(window.grist && window.self!==window.top){try{grist.ready({requiredAccess:'read table'});grist.onRecords(data=>{connected=true;records=Array.isArray(data)?data:[];$('status').textContent='Connecté à Grist · lecture seule';render()})}catch(e){$('status').textContent='Connexion Grist indisponible'}}
</script></body></html>
