// ---------- Vision étude ----------
function aedEtude(jour, crA, crB) {
  // min et max d'AED affectés au poste étude sur la période
  let mn = Infinity, mx = 0;
  for (let cr = crA; cr < crB; cr++) {
    const c = etat.aeds.filter((a) => !estAbsent(a.id, jour) && (etat.planning[a.id] || {})[jour]?.[cr] === etat.posteEtude).length;
    mn = Math.min(mn, c); mx = Math.max(mx, c);
  }
  return crB > crA ? [mn, mx] : [0, 0];
}
function majEffectif(jour, i, val) {
  etat.effectifs[jour][i] = val === "" ? "" : Math.max(0, parseInt(val, 10) || 0);
  sauver(); rendre();
}
function majPosteEtude(id) { etat.posteEtude = id; sauver(); rendre(); }
function majCapa(champ, val) { etat[champ] = Math.max(1, parseInt(val, 10) || 1); sauver(); rendre(); }

// 1 AED pour la salle principale, puis 1 AED par salle annexe entamée
function requisEtude(eff) {
  if (!eff || eff <= 0) return 0;
  if (eff <= etat.capaPrincipale) return 1;
  return 1 + Math.ceil((eff - etat.capaPrincipale) / etat.capaAnnexe);
}
// capacité totale couverte par n AED (1 salle principale + annexes)
const capaCouverte = (n) => n <= 0 ? 0 : etat.capaPrincipale + (n - 1) * etat.capaAnnexe;

function htmlVisionEtude() {
  const lignes = PERIODES_ETUDE.map(([deb, fin], i) => {
    const crA = heureVersCr(deb), crB = heureVersCr(fin);
    const label = deb.replace(/^0/, "").replace(":", "h") + " – " + fin.replace(/^0/, "").replace(":", "h");
    const cellules = JOURS.map((jour) => {
      const eff = etat.effectifs[jour][i];
      const [mn, mx] = aedEtude(jour, crA, crB);
      let fond = "#f8fafc", detail = "";
      if (eff !== "" && eff > 0) {
        const requis = requisEtude(eff);
        fond = mn < requis ? "#fee2e2" : capaCouverte(mn) - eff <= 5 ? "#fef9c3" : "#dcfce7";
        detail = `<div class="detail">AED étude : <b>${mn === mx ? mn : mn + "–" + mx}</b> · requis : <b>${requis}</b> (${capaCouverte(requis)} pl.)</div>`;
      } else if (eff !== "" && eff === 0) {
        detail = `<div class="detail" style="color:#94a3b8">—</div>`;
      }
      return `<td class="cell-etude" style="background:${fond}">
        <input class="eff" type="number" min="0" value="${eff}" onchange="majEffectif('${jour}',${i},this.value)"> élèves
        ${detail}
      </td>`;
    }).join("");
    return `<tr><td class="centre" style="font-weight:600;white-space:nowrap">${label}</td>${cellules}</tr>`;
  }).join("");

  return `<div class="carte" style="margin-bottom:14px">
    <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-bottom:10px">
      <h3 style="font-size:15px">Couverture des études</h3>
      <label style="font-size:12.5px;color:#475569">Poste étude :
        <select onchange="majPosteEtude(this.value)" style="font-size:12.5px;background:#f1f5f9;border:none;border-radius:5px;padding:3px 5px">
          ${etat.postes.map((p) => `<option value="${p.id}"${p.id === etat.posteEtude ? " selected" : ""}>${ech(p.nom)}</option>`).join("")}
        </select>
      </label>
      <label style="font-size:12.5px;color:#475569">Salle principale :
        <input type="number" min="1" max="500" value="${etat.capaPrincipale}" onchange="majCapa('capaPrincipale',this.value)" style="width:52px;font-size:12.5px;background:#f1f5f9;border:none;border-radius:5px;padding:3px 5px"> pl.
      </label>
      <label style="font-size:12.5px;color:#475569">Salles annexes :
        <input type="number" min="1" max="200" value="${etat.capaAnnexe}" onchange="majCapa('capaAnnexe',this.value)" style="width:52px;font-size:12.5px;background:#f1f5f9;border:none;border-radius:5px;padding:3px 5px"> pl.
      </label>
    </div>
    <p class="aide" style="margin:0 0 8px">Effectifs élèves issus de Pronote (max observé par période) — modifiables directement dans les cases.
    « AED étude » = nombre d'AED positionnés sur le poste étude pendant la période (min–max si ça varie).
    « Requis » = 1 AED pour la salle principale (${etat.capaPrincipale} places), puis 1 AED par salle annexe de ${etat.capaAnnexe} entamée.
    Vert = couverture suffisante · Jaune = limite (moins de 5 places de marge) · Rouge = insuffisante.</p>
    <table>
      <thead><tr><th style="width:110px">Période</th>${JOURS.map((j) => `<th>${j}</th>`).join("")}</tr></thead>
      <tbody>${lignes}</tbody>
    </table>
  </div>`;
}

// ---------- Impression / PDF ----------
function blocsDansPlanning(planning, aedId, jour) {
  const res = [];
  let cour = null;
  for (let cr = 0; cr <= NB; cr++) {
    const pid = cr < NB ? (planning[aedId] || {})[jour]?.[cr] : null;
    if (cour && pid !== cour.pid) { cour.fin = cr; res.push(cour); cour = null; }
    if (pid && !cour) cour = { pid, debut: cr, fin: cr + 1 };
  }
  return res;
}
function blocs(aedId, jour) {
  return blocsDansPlanning(etat.planning, aedId, jour);
}

const heuresJourPlanning = (planning, aedId, jour) =>
  Object.keys((planning[aedId] || {})[jour] || {}).length * PAS / 60;
const heuresSemainePlanning = (planning, aedId) =>
  JOURS.reduce((t, j) => t + heuresJourPlanning(planning, aedId, j), 0);

const initiales = (nom) =>
  nom.trim().split(/\s+/).map((m) => m[0]).join("").toUpperCase().slice(0, 3) || "?";

const dateJour = () => new Date().toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });

const legendePostes = () =>
  `<div class="legende">${etat.postes.map((p) =>
    `<span><i style="background:${COULEURS[p.couleur].fond}"></i>${ech(p.nom)}</span>`).join("")}</div>`;

const suffixeSemaine = () => semaineReelle
  ? " — Semaine du " + frDate(semaineReelle)
  : (etat.semaines.length > 1 ? " — " + semaineActive().nom : "");

const cartoucheSignature = () => `
  <div style="display:flex;gap:24px;margin-top:14px">
    <div style="flex:1;border:1px solid #cbd5e1;border-radius:6px;padding:6px 8px;height:64px;font-size:9px;color:#475569">
      Signature de l'AED<br>Fait le ______ / ______ / __________
    </div>
    <div style="flex:1;border:1px solid #cbd5e1;border-radius:6px;padding:6px 8px;height:64px;font-size:9px;color:#475569">
      Signature du CPE<br>Fait le ______ / ______ / __________
    </div>
  </div>`;

// Format 1 : une page par AED
function htmlImpressionParAed() {
  return etat.aeds.map((aed) => {
    let lignes = "";
    for (let cr = 0; cr < NB; cr++) {
      lignes += `<tr class="${classeCran(cr)}"><td class="h-col">${labelColonne(cr)}</td>`;
      for (const jour of JOURS) {
        const pid = (etat.planning[aed.id] || {})[jour]?.[cr];
        const poste = pid ? posteParId(pid) : null;
        const prec = (etat.planning[aed.id] || {})[jour]?.[cr - 1];
        const debut = pid && prec !== pid;
        lignes += `<td class="cr" style="${poste ? "background:" + COULEURS[poste.couleur].fond : ""}">${
          debut && poste ? `<span class="etiquette" style="color:${COULEURS[poste.couleur].texte}">${ech(poste.nom)}</span>` : ""
        }</td>`;
      }
      lignes += "</tr>";
    }
    return `<div class="page">
      <h1>${ech(etat.titre)}${suffixeSemaine()}</h1>
      <h2 class="sous-titre">${ech(aed.nom)} — ${fmtH(heuresSemaine(aed.id))} / ${fmtH(aed.quotite)}</h2>
      <table>
        <thead><tr><th class="h-col"></th>${JOURS.map((j) =>
          `<th>${j}<div style="font-weight:400;color:${estAbsent(aed.id, j) ? "#e11d48" : "#94a3b8"}">${estAbsent(aed.id, j) ? "ABSENT" : fmtH(heuresJour(aed.id, j))}</div></th>`).join("")}</tr></thead>
        <tbody>${lignes}</tbody>
      </table>
      ${legendePostes()}
      ${cartoucheSignature()}
      <div class="pied">Édité le ${dateJour()}</div>
    </div>`;
  }).join("");
}

// Format 2 : planning général (blocs horaires par AED et par jour)
function htmlImpressionGeneral() {
  const lignes = etat.aeds.map((a) => {
    const cellules = JOURS.map((jour) => {
      if (estAbsent(a.id, jour)) return `<td class="bloc-jour" style="color:#e11d48;text-align:center;font-weight:700">ABSENT</td>`;
      const bs = blocs(a.id, jour);
      if (!bs.length) return `<td class="bloc-jour" style="color:#cbd5e1;text-align:center">—</td>`;
      return `<td class="bloc-jour">${bs.map((b) => {
        const p = posteParId(b.pid);
        return `<span style="white-space:nowrap"><i style="display:inline-block;width:7px;height:7px;border-radius:2px;background:${p ? COULEURS[p.couleur].fond : "#ccc"}"></i> <b>${labelHeure(b.debut)}–${labelHeure(b.fin)}</b> ${p ? ech(p.nom) : "?"}</span>`;
      }).join("<br>")}</td>`;
    }).join("");
    const total = heuresSemaine(a.id);
    return `<tr>
      <td class="bloc-jour" style="font-weight:600;white-space:nowrap">${ech(a.nom)}<br><span style="font-weight:400;color:#64748b">${fmtH(a.quotite)}</span></td>

      <td class="centre" style="font-weight:600;color:${total > a.quotite ? "#e11d48" : "#1e293b"}">${fmtH(total)}</td>

      <tbody>${lignes}</tbody>

// Format 3 : grille superposée (tous les AED côte à côte par jour)
function htmlImpressionSuperpose() {
  const nA = etat.aeds.length;
  let entete1 = `<th class="h-col" rowspan="2"></th>`;
  let entete2 = "";
  for (const jour of JOURS) {
    entete1 += `<th colspan="${nA}">${jour}</th>`;
    entete2 += etat.aeds.map((a) =>
      `<th style="font-size:8px;padding:1px 2px" title="${ech(a.nom)}">${ech(initiales(a.nom))}</th>`).join("");

  for (let cr = 0; cr < NB; cr++) {
    lignes += `<tr><td class="h-col">${cr % 2 === 0 ? labelHeure(cr) : ""}</td>`;

      for (const a of etat.aeds) {

        lignes += `<td class="mini" style="${poste ? "background:" + COULEURS[poste.couleur].fond : ""}"></td>`;
      }

    <table>
      <thead><tr>${entete1}</tr><tr>${entete2}</tr></thead>
      <tbody>${lignes}</tbody>
    </table>
    ${legendeAeds}

const signeH = (h) => h > 0 ? "+" + fmtH(h) : h < 0 ? "−" + fmtH(Math.abs(h)) : "0h00";

function semainesReferenceFiche() {
  const refs = [], vus = new Set();
  const ajouter = (label, id) => {
    const sem = etat.semaines.find((s) => s.id === id);
    if (!sem || vus.has(sem.id)) return;
    refs.push({ label, sem });
    vus.add(sem.id);
  };
  const alt = etat.reglages.alternance || {};
  if (alt.mode === "paireImpaire") {
    ajouter("Semaines impaires", alt.semaineImpaire);
    ajouter("Semaines paires", alt.semainePaire);
  }
  if (!refs.length) {
    const sem = semaineActive() || etat.semaines[0];
    if (sem) refs.push({ label: sem.nom, sem });
  }
  return refs;
}

function cellulePlanningFiche(planning, aedId, jour) {
  const bs = blocsDansPlanning(planning, aedId, jour);
  if (!bs.length) return `<span style="color:#cbd5e1">—</span>`;
  return bs.map((b) => {
    const p = posteParId(b.pid);
    return `<span style="display:block;white-space:nowrap;margin:1px 0">
      <i style="display:inline-block;width:6px;height:6px;border-radius:2px;background:${p ? COULEURS[p.couleur].fond : "#ccc"}"></i>
      <b>${labelHeure(b.debut)}–${labelHeure(b.fin)}</b> ${p ? ech(p.nom) : "?"}
    </span>`;
  }).join("");
}

function htmlPlanningFiche(aed) {
  const refs = semainesReferenceFiche();
  const lignes = refs.map(({ label, sem }) => {
    const planning = sem.planning || {};
    return `<tr>
      <td style="font-weight:700;white-space:nowrap">${ech(label)}${label !== sem.nom ? `<div style="font-weight:400;color:#64748b">${ech(sem.nom)}</div>` : ""}</td>
      ${JOURS.map((j) => `<td>${cellulePlanningFiche(planning, aed.id, j)}</td>`).join("")}
      <td class="centre" style="font-weight:700">${fmtH(heuresSemainePlanning(planning, aed.id))}</td>
    </tr>`;
  }).join("");
  return `<h3>Planning de référence</h3>
  <table class="fiche-table">
    <thead><tr><th style="text-align:left;width:72px">Semaine</th>${JOURS.map((j) => `<th>${j.slice(0, 3)}</th>`).join("")}<th>Total</th></tr></thead>
    <tbody>${lignes}</tbody>
  </table>`;
}

function htmlAbsencesFiche(aed) {
  const absences = etat.absencesAn
    .filter((abs) => abs.aedId === aed.id && abs.au >= debutContrat(aed) && abs.du <= finContrat(aed))
    .sort((a, b) => a.du.localeCompare(b.du));
  if (!absences.length) {
    return `<h3>Absences de l'année</h3><table class="fiche-table"><tbody><tr><td class="muted">Aucune absence enregistrée sur la période du contrat.</td></tr></tbody></table>`;
  }
  const lignes = absences.map((abs) => {
    const jours = joursDecomptes(abs).filter((j) => dateDansContrat(aed, j.iso));
    const heures = jours.reduce((t, j) => t + j.heures, 0);
    const semaines = [...new Set(jours.map((j) => j.semaine).filter(Boolean))];
    return `<tr>
      <td>${frDate(abs.du)}${abs.au !== abs.du ? " → " + frDate(abs.au) : ""}</td>
      <td>${ech(abs.motif)}${abs.note ? `<div style="color:#64748b">${ech(abs.note)}</div>` : ""}</td>
      <td class="centre">${jours.length || "—"}</td>
      <td class="centre">${heures ? fmtH(heures) : "—"}</td>
      <td class="centre" style="font-weight:700;color:${abs.rattraper && heures ? "#e11d48" : "#059669"}">${abs.rattraper && heures ? "−" + fmtH(heures) : "0h00"}</td>
      <td>${semaines.length ? semaines.map(ech).join(" / ") : `<span style="color:#cbd5e1">—</span>`}</td>
    </tr>`;
  }).join("");
  return `<h3>Absences de l'année</h3>
  <table class="fiche-table">
    <thead><tr><th>Dates</th><th>Motif</th><th>Jours</th><th>Heures</th><th>Impact bilan</th><th>Semaine</th></tr></thead>
    <tbody>${lignes}</tbody>
  </table>`;
}

function htmlJournalFiche(aed) {
  const ecritures = etat.heuresJournal
    .filter((e) => e.aedId === aed.id && dateDansContrat(aed, e.date))
    .sort((a, b) => a.date.localeCompare(b.date));
  if (!ecritures.length) {
    return `<h3>Journal des heures ±</h3><table class="fiche-table"><tbody><tr><td class="muted">Aucune écriture enregistrée sur la période du contrat.</td></tr></tbody></table>`;
  }
  const lignes = ecritures.map((e) => `<tr>
    <td class="centre">${frDate(e.date)}</td>
    <td>${ech(e.motif)}${e.note ? `<div style="color:#64748b">${ech(e.note)}</div>` : ""}</td>
    <td class="centre" style="font-weight:700;color:${e.heures >= 0 ? "#059669" : "#e11d48"}">${signeH(e.heures)}</td>
  </tr>`).join("");
  return `<h3>Journal des heures ±</h3>
  <table class="fiche-table">
    <thead><tr><th>Date</th><th>Motif</th><th>Heures</th></tr></thead>
    <tbody>${lignes}</tbody>
  </table>`;
}

      </div>
      ${htmlPlanningFiche(aed)}
      ${htmlAbsencesFiche(aed)}

      <div class="pied">Édité le ${dateJour()}</div>

// ---------- Export Excel ----------
let sheetJSPret = null;
function chargerSheetJS() {
  if (window.XLSX) return Promise.resolve();
  if (sheetJSPret) return sheetJSPret;
  sheetJSPret = new Promise((ok, ko) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = ok;
    s.onerror = () => { sheetJSPret = null; ko(); };
    document.head.appendChild(s);
  });
  return sheetJSPret;
}

const nomFeuille = (nom) => nom.replace(/[\\\/\?\*\[\]:]/g, " ").trim().slice(0, 31) || "AED";

function exporterExcel() {
  chargerSheetJS().then(() => {
    const wb = XLSX.utils.book_new();

    // Feuille 1 : synthèse des heures
    const synthese = [["AED", ...JOURS, "Total", "Quotité", "Écart"]];
    for (const a of etat.aeds) {
      const total = heuresSemaine(a.id);
      const arr2 = (x) => Math.round(x * 100) / 100;
      synthese.push([a.nom, ...JOURS.map((j) => heuresJour(a.id, j) ? arr2(heuresJour(a.id, j)) : ""), arr2(total), a.quotite, arr2(total - a.quotite)]);
    }
    const ws1 = XLSX.utils.aoa_to_sheet(synthese);
    ws1["!cols"] = [{ wch: 20 }, ...JOURS.map(() => ({ wch: 10 })), { wch: 8 }, { wch: 8 }, { wch: 8 }];
    XLSX.utils.book_append_sheet(wb, ws1, "Synthèse");

    // Feuille 2 : planning général (blocs horaires)
    const general = [["AED", ...JOURS]];
    for (const a of etat.aeds) {
      general.push([
        a.nom,
        ...JOURS.map((jour) =>
          blocs(a.id, jour).map((b) => {
            const p = posteParId(b.pid);
            return labelHeure(b.debut) + "–" + labelHeure(b.fin) + " " + (p ? p.nom : "?");
          }).join("\n")
        ),
      ]);
    }
    const ws2 = XLSX.utils.aoa_to_sheet(general);
    ws2["!cols"] = [{ wch: 20 }, ...JOURS.map(() => ({ wch: 32 }))];
    XLSX.utils.book_append_sheet(wb, ws2, "Planning général");

    // Une feuille par AED : grille créneaux × jours
    const noms = new Set(["Synthèse", "Planning général"]);
    for (const a of etat.aeds) {
      const grille = [["Heure", ...JOURS]];
      for (let cr = 0; cr < NB; cr++) {
        grille.push([
          labelHeure(cr) + "–" + labelHeure(cr + 1),
          ...JOURS.map((jour) => {
            const pid = (etat.planning[a.id] || {})[jour]?.[cr];
            return pid ? (posteParId(pid)?.nom || "?") : "";
          }),
        ]);
      }
      const ws = XLSX.utils.aoa_to_sheet(grille);
      ws["!cols"] = [{ wch: 13 }, ...JOURS.map(() => ({ wch: 22 }))];
      let nom = nomFeuille(a.nom), n = 2;
      while (noms.has(nom)) nom = nomFeuille(a.nom).slice(0, 28) + " " + n++;
      noms.add(nom);
      XLSX.utils.book_append_sheet(wb, ws, nom);
    }

    // Feuilles RH
    const arr2 = (x) => Math.round(x * 100) / 100;
    const nomAed = (id) => etat.aeds.find((a) => a.id === id)?.nom || "?";
    const fAbs = [["AED", "Du", "Au", "Motif", "Statut", "Jours décomptés", "Heures perdues", "À rattraper", "Note"]];
    for (const abs of etat.absencesAn.slice().sort((a, b) => a.du.localeCompare(b.du))) {
      const js = joursDecomptes(abs);
      fAbs.push([nomAed(abs.aedId), abs.du, abs.au, abs.motif, abs.statut || "", js.length, arr2(js.reduce((t, j) => t + j.heures, 0)), abs.rattraper ? "oui" : "non", abs.note || ""]);
    }
    const wsA = XLSX.utils.aoa_to_sheet(fAbs);
    wsA["!cols"] = [{ wch: 18 }, { wch: 11 }, { wch: 11 }, { wch: 20 }, { wch: 15 }, { wch: 14 }, { wch: 13 }, { wch: 11 }, { wch: 28 }];
    XLSX.utils.book_append_sheet(wb, wsA, "Absences");

    const fJrn = [["Date", "AED", "Motif", "Heures", "Note"]];
    for (const e of etat.heuresJournal.slice().sort((a, b) => a.date.localeCompare(b.date)))
      fJrn.push([e.date, nomAed(e.aedId), e.motif, arr2(e.heures), e.note || ""]);
    const wsJ = XLSX.utils.aoa_to_sheet(fJrn);
    wsJ["!cols"] = [{ wch: 11 }, { wch: 18 }, { wch: 22 }, { wch: 9 }, { wch: 28 }];
    XLSX.utils.book_append_sheet(wb, wsJ, "Journal heures");

    const fBil = [["AED", "Hebdo posé", "Dû annuel", "Réalisé à date", "Abs. à rattraper (à date)", "J. admin (h)", "Journal ±", "Projection", "Écart projeté"]];
    for (const a of etat.aeds) {
      const b = bilanAed(a);
      fBil.push([a.nom, arr2(b.hebdo), arr2(b.du), arr2(b.realise), arr2(b.absADate), arr2(b.adminH), arr2(b.jrnTotal), arr2(b.projection), arr2(b.ecart)]);
    }
    const wsB = XLSX.utils.aoa_to_sheet(fBil);
    wsB["!cols"] = fBil[0].map((_, i) => ({ wch: i === 0 ? 18 : 13 }));
    XLSX.utils.book_append_sheet(wb, wsB, "Bilan annuel");

    const fDos = [["AED", "Téléphone", "Email", "Personne à prévenir", "Contrat", "Quotité", "1er poste AED", "Limite 6 ans"]];
    for (const a of etat.aeds) {
      const rh = a.rh || {};
      fDos.push([a.nom, a.telephone || "", a.email || "", rh.urgence || "", contratLibelle(a), a.quotite, debutStatut(a) || "", debutStatut(a) ? sixAnsApres(debutStatut(a)) : ""]);
    }
    const wsD = XLSX.utils.aoa_to_sheet(fDos);
    wsD["!cols"] = [{ wch: 18 }, { wch: 14 }, { wch: 24 }, { wch: 24 }, { wch: 28 }, { wch: 9 }, { wch: 13 }, { wch: 13 }];
    XLSX.utils.book_append_sheet(wb, wsD, "Dossiers");

    XLSX.writeFile(wb, "edt-aed-rh.xlsx");
  }).catch(() =>
    alert("L'export Excel nécessite une connexion internet (téléchargement du module à la première utilisation).")
  );
}

// Prochain jour de cours (la fiche se remplit la veille pour le lendemain)
function prochainJourCours() {
  const d = new Date(aujourdhuiIso() + "T12:00:00");
  for (let k = 1; k <= 420; k++) {
    d.setDate(d.getDate() + 1);
    const iso = isoLocal(d);
    if (iso > etat.reglages.finAnnee) return null;
    if ((d.getDay() + 6) % 7 < 5 && dansAnnee(iso) && !estFerie(iso) && !estVacancesIso(iso)) return iso;
  }
  return null;
}

// Fiche d'auto-répartition : UNE journée, grille d'équipe complète + tableaux à remplir
function htmlImpressionRepartition(iso) {
  if (!iso) return "";
  const jourNom = JOURS[(new Date(iso + "T12:00:00").getDay() + 6) % 7];
  const plan = planningPourDate(iso);
  const presents = etat.aeds.filter((a) =>
    !estAbsenteDate(a.id, iso) && Object.keys((plan[a.id] || {})[jourNom] || {}).length);
  const absents = etat.aeds.filter((a) => estAbsenteDate(a.id, iso));

  // grille de la journée : une colonne par AED présent
  let lignes = "";
  for (let cr = 0; cr < NB; cr++) {
    lignes += `<tr class="${classeCran(cr)}"><td class="h-col">${labelColonne(cr)}</td>`;
    for (const a of presents) {
      const pid = (plan[a.id] || {})[jourNom]?.[cr];
      const poste = pid ? posteParId(pid) : null;
      lignes += `<td class="mini" style="${poste ? "background:" + COULEURS[poste.couleur].fond : ""}"></td>`;
    }
    lignes += "</tr>";
  }
  const grille = presents.length ? `<table style="margin:8px 0">
    <thead><tr><th class="h-col"></th>${presents.map((a) =>
      `<th style="font-size:9.5px;padding:2px 3px">${ech(a.nom)}</th>`).join("")}</tr></thead>
    <tbody>${lignes}</tbody>
  </table>` : `<p>Aucun AED présent ce jour.</p>`;

  const sections = blocsRepartition(iso).map(({ bande, titre, sousPostes, candidats }) => {
    const rep = (etat.repartitions[iso] || {})[bande] || {};
    const lignesSp = sousPostes.map((sp) => {
      const noms = candidats.filter((a) => rep[a.id] === sp).map((a) => ech(a.nom)).join(", ");
      return `<tr>
        <td style="padding:6px 8px;font-weight:700;width:170px;font-size:12px">${ech(sp)}</td>
        <td style="padding:6px 8px;font-size:12px;border-bottom:1px solid #94a3b8">${noms || "&nbsp;"}</td>
      </tr>`;
    }).join("");
    return `<div style="flex:1;min-width:280px">
      <h1 style="font-size:13.5px;margin:0 0 2px">${ech(titre)}</h1>
      <p style="font-size:10px;color:#475569;margin:0 0 4px">Postés : ${candidats.length ? candidats.map((a) => ech(a.nom)).join(" · ") : "aucun"}</p>
      <table style="width:100%"><tbody>${lignesSp}</tbody></table>
    </div>`;
  }).join("");

  return `<div class="page doc" style="max-width:none">
    <div class="entete-doc"><span><b>${ech(etat.titre)}</b></span><span>Édité le ${dateJour()}</span></div>
    <h1>Équipe du ${jourNom.toLowerCase()} ${frDate(iso)} — auto-répartition</h1>
    <p style="font-size:11px;color:#475569;margin:2px 0 4px">Répartition à compléter par l'équipe <b>la veille pour le lendemain</b>, puis à afficher en vie scolaire. Signalez tout créneau non couvert au CPE.
    ${absents.length ? ` · <b style="color:#e11d48">Absents : ${absents.map((a) => ech(a.nom)).join(", ")}</b>` : ""}</p>
    ${grille}
    ${legendePostes()}
    <div style="display:flex;gap:24px;flex-wrap:wrap;margin-top:10px">${sections}</div>
  </div>`;
}

// ---------- Vue mensuelle RH ----------
let moisAffiche = aujourdhuiIso().slice(0, 7);
function majMois(v) { if (v) { moisAffiche = v; rendre(); } }
function htmlMois() {
  const [an, mo] = moisAffiche.split("-").map(Number);
  const nbJours = new Date(an, mo, 0).getDate();
  const evts = {};
  const pousse = (iso, texte, coul) => {
    if ((iso || "").slice(0, 7) !== moisAffiche) return;
    (evts[iso] = evts[iso] || []).push({ texte, coul });
  };
  for (const [iso, nom] of feriesAnnee(an)) pousse(iso, "Férié — " + nom, "#7c3aed");
  for (const v of etat.reglages.vacances) {
    pousse(v.du, "🏖 Début des vacances (" + v.nom + ")", "#0891b2");
    pousse(v.au, "🏖 Dernier jour des vacances (" + v.nom + ")", "#0891b2");
  }
  for (const abs of etat.absencesAn) {
    const nom = etat.aeds.find((x) => x.id === abs.aedId)?.nom || "?";
    pousse(abs.du, `🤒 ${nom} — début d'absence (${abs.motif}${abs.au !== abs.du ? ", jusqu'au " + frDate(abs.au) : ""}) · ${abs.statut || ""}`, "#e11d48");
  }
  for (const e of etat.heuresJournal)
    pousse(e.date, `⏱ ${etat.aeds.find((x) => x.id === e.aedId)?.nom || "?"} — ${e.motif} ${e.heures > 0 ? "+" : "−"}${fmtH(Math.abs(e.heures))}`, e.heures >= 0 ? "#059669" : "#e11d48");
  for (const a of etat.aeds) {
    if (a.contratFin) pousse(a.contratFin, `📄 Fin de contrat — ${a.nom}`, "#e11d48");
    const limite = sixAnsApres(debutStatut(a));
    if (limite) pousse(limite, `⚖️ Limite des 6 ans — ${a.nom}`, "#7c3aed");
    for (const c of a.rh?.contrats || [])
      if (c.finEssai) pousse(c.finEssai, `📄 Fin de période d'essai — ${a.nom}`, "#d97706");
    for (const f of a.rh?.formations || [])
      if (f.validite) pousse(f.validite, `🎓 Expiration formation ${f.nom} — ${a.nom}`, "#d97706");
    for (const e of a.rh?.entretiens || [])
      pousse(e.date, `🗣 Entretien ${e.realise ? "réalisé" : "prévu"} — ${a.nom}`, e.realise ? "#059669" : "#2563eb");
  }
  let lignes = "";
  for (let j = 1; j <= nbJours; j++) {
    const iso = moisAffiche + "-" + String(j).padStart(2, "0");
    if (!evts[iso]) continue;
    const d = new Date(an, mo - 1, j);
    const we = d.getDay() === 0 || d.getDay() === 6;
    lignes += `<tr>
      <td class="centre" style="white-space:nowrap;font-weight:600;${we ? "color:#94a3b8" : ""}">${d.toLocaleDateString("fr-FR", { weekday: "short", day: "numeric" })}</td>
      <td style="padding:5px 8px;text-align:left;font-size:12.5px">${evts[iso].map((e) =>
        `<div style="padding:1px 0"><span style="color:${e.coul};font-weight:600">●</span> ${ech(e.texte)}</div>`).join("")}</td>
    </tr>`;
  }
  return `<div class="carte">
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:8px">
      <h3 style="font-size:15px">Vue mensuelle RH</h3>
      <input type="month" value="${moisAffiche}" onchange="majMois(this.value)" style="font-size:13px">
    </div>
    <p class="aide" style="margin:0 0 8px">Tous les événements RH du mois : fins de contrat, périodes d'essai, limite des 6 ans, entretiens, formations, absences, écritures d'heures, fériés et vacances.</p>
    ${lignes ? `<table style="max-width:760px"><thead><tr><th style="width:80px">Jour</th><th style="text-align:left">Événements</th></tr></thead><tbody>${lignes}</tbody></table>`
      : `<p class="aide">Aucun événement ce mois-ci.</p>`}
  </div>`;
}

// ---------- Recherche globale ----------
function allerA(vueCible, aedId) {
  if (aedId) aedActif = aedId;
  document.getElementById("res-recherche").style.display = "none";
  document.getElementById("recherche").value = "";
  setVue(vueCible);
}
function rechercher(q) {
  q = q.toLowerCase().trim();
  const res = [];
  if (q.length < 2) return res;
  const m = (s) => (s || "").toLowerCase().includes(q);
  for (const a of etat.aeds) {
    if (m(a.nom) || m(a.telephone) || m(a.email)) res.push({ label: `<b>${ech(a.nom)}</b> — dossier AED`, vue: "dossiers", aedId: a.id });
    for (const o of a.rh?.obs || []) if (m(o.texte)) res.push({ label: `${ech(a.nom)} — observation : ${ech(o.texte.slice(0, 60))}`, vue: "dossiers", aedId: a.id });
    for (const c of a.rh?.contrats || []) if (m(c.note) || m(c.type)) res.push({ label: `${ech(a.nom)} — contrat ${ech(c.type)} ${c.du ? frDate(c.du) : ""}`, vue: "dossiers", aedId: a.id });
    for (const f of a.rh?.formations || []) if (m(f.nom) || m(f.note)) res.push({ label: `${ech(a.nom)} — formation ${ech(f.nom)}`, vue: "dossiers", aedId: a.id });
    for (const e of a.rh?.entretiens || []) if (m(e.cr)) res.push({ label: `${ech(a.nom)} — entretien : ${ech((e.cr || "").slice(0, 60))}`, vue: "dossiers", aedId: a.id });
  }
  for (const abs of etat.absencesAn) {
    const nom = etat.aeds.find((x) => x.id === abs.aedId)?.nom || "?";
    if (m(nom) || m(abs.motif) || m(abs.note) || m(abs.statut)) res.push({ label: `${ech(nom)} — absence ${ech(abs.motif)} (${frDate(abs.du)})`, vue: "absences", aedId: abs.aedId });
  }
  for (const e of etat.heuresJournal) {
    const nom = etat.aeds.find((x) => x.id === e.aedId)?.nom || "?";
    if (m(nom) || m(e.motif) || m(e.note)) res.push({ label: `${ech(nom)} — ${ech(e.motif)} ${e.heures > 0 ? "+" : ""}${e.heures}h (${frDate(e.date)})`, vue: "annee", aedId: e.aedId });
  }
  for (const p of etat.postes) if (m(p.nom)) res.push({ label: `Poste — ${ech(p.nom)} (synthèse équipe)`, vue: "equipe" });
  return res.slice(0, 20);
}
document.getElementById("recherche").addEventListener("input", (e) => {
  const res = rechercher(e.target.value);
  const panneau = document.getElementById("res-recherche");
  if (!res.length) { panneau.style.display = "none"; return; }
  panneau.innerHTML = res.map((r) =>
    `<div class="res" onclick="allerA('${r.vue}'${r.aedId ? `,'${r.aedId}'` : ""})">${r.label}</div>`).join("");
  panneau.style.display = "block";
});
document.addEventListener("mousedown", (e) => {
  if (!e.target.closest("#res-recherche") && e.target.id !== "recherche")
    document.getElementById("res-recherche").style.display = "none";
});

// Au lancement : si on est pendant l'année scolaire, afficher la semaine en cours
if (dansAnnee(aujourdhuiIso())) {
  semaineReelle = lundiDeSemaine(aujourdhuiIso());
  etat.planning = etat.derogations[semaineReelle] || semainePourDate(semaineReelle)?.planning || {};
}
rendre();
initialiserSauvegardeFichier();
</script>
<script>
// ---------- Couche serveur (mode multi-utilisateurs) ----------
(async () => {
  if (!location.protocol.startsWith("http")) return; // le fichier reste utilisable seul
  try {
    const rMoi = await fetch("/api/moi");
    if (rMoi.status === 401) { location.href = "/"; return; }
    const moi = await rMoi.json();
    if (moi.role !== "cpe") { location.href = "aed-pilote.html"; return; }

    // 1. Charger l'état depuis le serveur (source de vérité)
    const rEtat = await fetch("/api/etat");
    if (rEtat.ok) {
      const d = await rEtat.json();
      if (d && d.aeds) {
        etat = migrer(d);
        normaliser();
        aedActif = etat.aeds[0]?.id;
        posteActif = etat.postes[0]?.id;
        if (dansAnnee(aujourdhuiIso())) {
          semaineReelle = lundiDeSemaine(aujourdhuiIso());
          etat.planning = etat.derogations[semaineReelle] || semainePourDate(semaineReelle)?.planning || {};
        } else {
          semaineReelle = null;
          etat.planning = semaineActive()?.planning || {};
        }
        rendre();
      }
    }

    // 2. Pousser vers le serveur à chaque sauvegarde (avec temporisation)
    const sauverLocal = sauver;
    let minuteurPush = null;
    window.sauver = function () {
      sauverLocal();
      clearTimeout(minuteurPush);
      minuteurPush = setTimeout(async () => {
        try {
          const rep = await fetch("/api/etat", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(etat),
          });
          const s = document.getElementById("statut");
          s.textContent = rep.ok ? "✓ serveur" : "⚠ erreur serveur";
          setTimeout(() => (s.textContent = ""), 1800);
        } catch (e) {
          document.getElementById("statut").textContent = "⚠ serveur injoignable";
        }
      }, 800);
    };
    // premier envoi si le serveur était vide
    if (!rEtat.ok) window.sauver();

    // 3. Récupérer en continu les répartitions saisies par les AED
    setInterval(async () => {
      try {
        const rr = await fetch("/api/repartitions");
        if (rr.ok) {
          etat.repartitions = await rr.json();
          if (vue === "repartition") rendre();
        }
      } catch (e) {}
    }, 20000);

    // 4. Boutons serveur dans l'en-tête : comptes, mot de passe, déconnexion
    const entete = document.querySelector("header");
    const zone = document.createElement("span");
    zone.style.cssText = "display:inline-flex;gap:6px";
    zone.innerHTML = `
      <button class="btn" id="btn-comptes">👥 Comptes</button>
      <button class="btn-ico" title="Changer mon mot de passe" id="btn-mdp">🔑</button>
      <button class="btn-ico" title="Se déconnecter" id="btn-deco">🚪</button>`;
    entete.appendChild(zone);
    document.getElementById("btn-deco").onclick = async () => { await fetch("/api/deconnexion", { method: "POST" }); location.href = "/"; };
    document.getElementById("btn-mdp").onclick = changerMdp;
    document.getElementById("btn-comptes").onclick = ouvrirComptes;

    async function changerMdp() {
      const actuel = prompt("Mot de passe actuel :");
      if (actuel === null) return;
      const nouveau = prompt("Nouveau mot de passe (8 caractères minimum) :");
      if (nouveau === null) return;
      const r = await fetch("/api/mdp", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ actuel, nouveau }) });
      alert(r.ok ? "Mot de passe modifié." : "Échec : " + ((await r.json()).erreur || ""));
    }

    async function ouvrirComptes() {
      let panneau = document.getElementById("panneau-comptes");
      if (panneau) { panneau.remove(); return; }
      const r = await fetch("/api/comptes");
      const liste = r.ok ? await r.json() : [];
      panneau = document.createElement("div");
      panneau.id = "panneau-comptes";
      panneau.style.cssText = "position:fixed;top:56px;right:16px;z-index:95;background:#fff;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.18);padding:14px;width:330px;font-size:13px";
      panneau.innerHTML = `
        <div style="font-weight:700;margin-bottom:8px">Comptes d'accès</div>
        <div style="max-height:180px;overflow-y:auto;margin-bottom:10px">
          ${liste.map((c) => `<div style="display:flex;gap:6px;align-items:center;padding:3px 0;border-bottom:1px solid #f1f5f9">
            <span style="flex:1"><b>${c.login}</b> · ${c.nom} <span style="color:#94a3b8">(${c.role})</span></span>
            <button data-suppr="${c.login}" style="border:none;background:none;color:#e11d48;cursor:pointer">✕</button>
          </div>`).join("")}
        </div>
        <div style="font-weight:600;margin-bottom:4px">Créer / réinitialiser un compte AED</div>
        <input id="cpt-login" placeholder="identifiant (ex: m.dupont)" style="width:100%;margin-bottom:5px;padding:5px;border:1px solid #cbd5e1;border-radius:6px">
        <input id="cpt-nom" placeholder="nom affiché" style="width:100%;margin-bottom:5px;padding:5px;border:1px solid #cbd5e1;border-radius:6px">
        <input id="cpt-mdp" placeholder="mot de passe (8 car. min)" style="width:100%;margin-bottom:8px;padding:5px;border:1px solid #cbd5e1;border-radius:6px">
        <button id="cpt-creer" style="width:100%;padding:7px;background:#2563eb;color:#fff;border:none;border-radius:7px;font-weight:600;cursor:pointer">Enregistrer</button>
        <p style="color:#94a3b8;font-size:11px;margin-top:6px">Les comptes AED ne voient que les plannings et l'auto-répartition — jamais les absences, dossiers ou alertes.</p>`;
      document.body.appendChild(panneau);
      panneau.querySelectorAll("[data-suppr]").forEach((b) => (b.onclick = async () => {
        if (!confirm(`Supprimer le compte ${b.dataset.suppr} ?`)) return;
        await fetch("/api/comptes/" + encodeURIComponent(b.dataset.suppr), { method: "DELETE" });
        panneau.remove(); ouvrirComptes();
      }));
      panneau.querySelector("#cpt-creer").onclick = async () => {
        const r2 = await fetch("/api/comptes", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            login: panneau.querySelector("#cpt-login").value,
            nom: panneau.querySelector("#cpt-nom").value,
            mdp: panneau.querySelector("#cpt-mdp").value,
            role: "aed",
          }),
        });
        if (r2.ok) { panneau.remove(); ouvrirComptes(); }
        else alert("Échec : " + ((await r2.json()).erreur || ""));
      };
    }
  } catch (e) { console.warn("Mode serveur indisponible :", e); }
})();
</script>
