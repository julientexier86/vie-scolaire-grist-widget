<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vie scolaire — Gestion RH des AED</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script src="etat-grist.js"></script>
<script src="backend-grist.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f1f5f9; color: #1e293b; user-select: none; }
  button { cursor: pointer; font-family: inherit; }
  input, select { font-family: inherit; }

  header { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  #titre { flex: 1; min-width: 240px; font-size: 18px; font-weight: 600; border: none; border-bottom: 1px solid transparent; background: transparent; outline: none; }
  #titre:focus { border-bottom-color: #60a5fa; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; font-size: 13px; background: #1e293b; color: #fff; border: none; border-radius: 8px; }
  .btn:hover { background: #334155; }
  .btn-bleu { background: #2563eb; } .btn-bleu:hover { background: #1d4ed8; }

  .conteneur { display: flex; gap: 16px; padding: 16px; align-items: flex-start; }
  aside { width: 290px; flex-shrink: 0; display: flex; flex-direction: column; gap: 14px; }
  main { flex: 1; min-width: 0; }
  @media (max-width: 900px) { .conteneur { flex-direction: column; } aside { width: 100%; } }

  .carte { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; }
  .carte h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #64748b; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .btn-plus { border: none; background: none; color: #2563eb; font-size: 18px; line-height: 1; padding: 2px 6px; border-radius: 6px; }
  .btn-plus:hover { background: #eff6ff; }

  .ligne-aed, .ligne-poste { border: 1px solid transparent; border-radius: 8px; padding: 6px 8px; cursor: pointer; margin-bottom: 3px; }
  .ligne-aed:hover, .ligne-poste:hover { background: #f8fafc; }
  .ligne-aed.actif, .ligne-poste.actif { border-color: #60a5fa; background: #eff6ff; }
  .ligne-aed .rang1 { display: flex; align-items: center; gap: 6px; }
  .ligne-aed input.nom { flex: 1; min-width: 0; border: none; background: transparent; outline: none; font-weight: 500; font-size: 13px; }
  .ligne-aed input.quotite { width: 52px; text-align: right; font-size: 12px; background: #f1f5f9; border: none; border-radius: 4px; padding: 2px 4px; outline: none; }
  .ligne-aed .contrat { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 5px; }
  .ligne-aed .contrat label { font-size: 9.5px; color: #94a3b8; text-transform: uppercase; letter-spacing: .03em; }
  .ligne-aed .contrat input, .ligne-aed .contrat select { width: 100%; margin-top: 1px; font-size: 10.5px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 5px; padding: 2px 3px; color: #475569; }
  .ligne-aed .contact { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 5px; }
  .ligne-aed .contact input { width: 100%; font-size: 10.5px; background: #fff; border: 1px solid #e2e8f0; border-radius: 5px; padding: 2px 4px; color: #475569; }
  .rang2 { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .barre { flex: 1; height: 5px; background: #e2e8f0; border-radius: 99px; overflow: hidden; }
  .barre > div { height: 100%; border-radius: 99px; background: #10b981; }
  .barre > div.depasse { background: #f43f5e; }
  .heures { font-size: 11px; font-weight: 500; color: #64748b; white-space: nowrap; }
  .heures.depasse { color: #e11d48; }

  .ligne-poste { display: flex; align-items: center; gap: 8px; }
  .pastille { width: 12px; height: 12px; border-radius: 99px; flex-shrink: 0; }
  .ligne-poste input { flex: 1; min-width: 0; border: none; background: transparent; outline: none; font-size: 13px; }
  .btn-suppr { border: none; background: none; color: #94a3b8; padding: 2px; display: flex; }
  .btn-suppr:hover { color: #f43f5e; }
  .aide { font-size: 11px; color: #94a3b8; margin-top: 8px; }

  .alerte { display: flex; gap: 6px; font-size: 12.5px; color: #b45309; margin-bottom: 5px; line-height: 1.35; }
  .ok { font-size: 13px; color: #059669; }
  .mini-contact { display: block; margin-top: 2px; font-size: 10.5px; color: #64748b; font-weight: 400; }
  .liste-candidats { display: flex; flex-wrap: wrap; gap: 6px; }
  .candidat { border: 1px solid #dbeafe; background: #eff6ff; border-radius: 7px; padding: 5px 7px; font-size: 12px; line-height: 1.3; }

  .onglets { display: flex; gap: 8px; margin-bottom: 12px; }
  .onglet { padding: 7px 14px; font-size: 13px; border-radius: 8px; border: 1px solid #e2e8f0; background: #fff; }
  .onglet.actif { background: #2563eb; color: #fff; border-color: #2563eb; }

  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #e2e8f0; }
  th { background: #f8fafc; font-size: 12px; padding: 5px 8px; }
  th .ss-total { font-weight: 400; color: #94a3b8; font-size: 11px; }
  th .case-abs { display: block; font-weight: 400; font-size: 10px; color: #94a3b8; cursor: pointer; }
  th .case-abs.on { color: #e11d48; font-weight: 700; text-transform: uppercase; }
  th .case-abs input { vertical-align: -1px; margin-right: 2px; }
  td.heure-col, th.heure-col { border: none; background: none; width: 46px; text-align: right; padding-right: 5px; font-size: 10.5px; color: #94a3b8; vertical-align: top; }
  td.creneau { height: 4px; padding: 0; cursor: pointer; position: relative; border-top: none; border-bottom: none; }
  td.creneau:hover { background: #f8fafc; }
  td.creneau.occupe { cursor: grab; }
  td.creneau.occupe:active { cursor: grabbing; }
  td.creneau.deplacement-cible { outline: 1px solid #2563eb; outline-offset: -1px; z-index: 2; }
  tr.cran-30 td.creneau { border-top: 1px dotted #e2e8f0; }
  tr.cran-60 td.creneau { border-top: 1px solid #cbd5e1; }
  tr:last-child td.creneau, tr:last-child td.presence { border-bottom: 1px solid #cbd5e1; }
  td.creneau .etiquette { position: absolute; top: 1px; left: 3px; font-size: 10px; font-weight: 600; white-space: nowrap; z-index: 1; pointer-events: none; }

  .entete-grille { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
  .entete-grille h3 { font-size: 15px; }
  .entete-grille .sous { color: #94a3b8; font-weight: 400; font-size: 13px; }
  .copie { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #64748b; }
  .copie select { font-size: 12px; background: #f1f5f9; border: none; border-radius: 5px; padding: 3px 4px; }
  .copie button { font-size: 12px; padding: 3px 10px; background: #2563eb; color: #fff; border: none; border-radius: 5px; }

  .legende { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; font-size: 12px; }
  .legende span { display: inline-flex; align-items: center; gap: 5px; }
  .legende i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

  td.centre { text-align: center; padding: 5px 8px; font-size: 13px; }
  td.cell-etude { text-align: center; padding: 6px 6px; font-size: 11px; color: #475569; }
  td.cell-etude input.eff { width: 54px; text-align: center; font-size: 13px; font-weight: 600; border: 1px solid #cbd5e1; border-radius: 5px; padding: 2px; background: rgba(255,255,255,.75); }
  td.cell-etude .detail { margin-top: 3px; }
  td.presence { height: 4px; padding: 0; cursor: default; border-top: none; border-bottom: none; position: relative; }
  .badge-n { position: absolute; left: 50%; transform: translateX(-50%); top: 1px; z-index: 1; font-size: 9px; font-weight: 600; line-height: 11px; padding: 0 4px; border-radius: 4px; background: rgba(255,255,255,.82); color: #1e293b; pointer-events: none; }
  .badge-n.zero { color: #e11d48; }
  tr.cran-30 td.presence { border-top: 1px dotted #e2e8f0; }
  tr.cran-60 td.presence { border-top: 1px solid #cbd5e1; }

  .statut-sauvegarde { font-size: 11px; color: #94a3b8; }
  .heure-col .demi { font-size: 9px; color: #cbd5e1; }
  #infobulle { position: fixed; z-index: 50; display: none; background: #1e293b; color: #fff; font-size: 11.5px; font-weight: 500; padding: 4px 9px; border-radius: 6px; pointer-events: none; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.25); }

  /* ---------- Fenêtre de saisie manuelle ---------- */
  #voile { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: none; z-index: 100; align-items: center; justify-content: center; }
  #voile.ouvert { display: flex; }
  .modal { background: #fff; border-radius: 14px; padding: 18px; width: 320px; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
  .modal h3 { font-size: 15px; margin-bottom: 12px; }
  .modal .champ { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .modal .champ label { font-size: 13px; color: #475569; }
  .modal .champ input, .modal .champ select { font-size: 14px; padding: 5px 8px; border: 1px solid #cbd5e1; border-radius: 7px; background: #fff; }
  .modal .champ input[type="time"] { width: 120px; }
  .modal .erreur { font-size: 12px; color: #e11d48; min-height: 16px; margin-bottom: 4px; }
  .modal .boutons { display: flex; gap: 8px; justify-content: flex-end; }
  .modal .boutons .suppr { margin-right: auto; background: #fff; color: #e11d48; border: 1px solid #fecdd3; }
  .modal .boutons button { padding: 7px 14px; font-size: 13px; border-radius: 8px; border: none; }
  .modal .boutons .annuler { background: #f1f5f9; color: #334155; }
  .modal .boutons .valider { background: #2563eb; color: #fff; }
  #format-impression { font-size: 13px; padding: 6px 8px; border: 1px solid #e2e8f0; border-radius: 8px; background: #fff; }
  .grp-semaine { display: inline-flex; align-items: center; gap: 2px; background: #f1f5f9; border-radius: 8px; padding: 2px 4px; }

  /* ---------- Bandeau annuel (façon Pronote) ---------- */
  #bande-annee { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 6px 16px 4px; }
  #bande-sems { display: flex; gap: 3px; overflow-x: auto; padding-bottom: 4px; }
  .sem-btn { min-width: 27px; padding: 3px 2px; font-size: 11px; font-weight: 700; text-align: center; border: 1px solid #94a3b8; border-radius: 4px; background: #dbeafe; color: #1e3a8a; cursor: pointer; flex-shrink: 0; position: relative; }
  .sem-btn.varB { background: #fde68a; color: #713f12; }
  .sem-btn.vac { background: #e2e8f0; color: #b91c1c; }
  .sem-btn.type-btn { background: #1e293b; color: #fff; min-width: 44px; }
  .sem-btn.choisi { outline: 2px solid #2563eb; outline-offset: 1px; }
  .sem-btn.auj { border-color: #0f172a; border-width: 2px; }
  .sem-btn .derog { position: absolute; top: -3px; right: -2px; width: 7px; height: 7px; border-radius: 99px; background: #e11d48; border: 1px solid #fff; }
  #bande-info { font-size: 12px; color: #475569; padding-top: 3px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  #bande-info .btn-reset { font-size: 11.5px; padding: 2px 8px; background: #fff; color: #e11d48; border: 1px solid #fecdd3; border-radius: 6px; }
  @media print { #bande-annee { display: none !important; } }
  #sel-semaine { font-size: 13px; padding: 4px 4px; border: none; background: transparent; font-weight: 600; }
  .btn-ico { border: none; background: transparent; font-size: 15px; padding: 4px 6px; border-radius: 6px; color: #475569; }
  .btn-ico:hover { background: #e2e8f0; }

  /* ---------- Impression / PDF ---------- */
  #zone-impression { display: none; }
  @page { size: A4 landscape; margin: 10mm; }
  @page bilan { size: A4 portrait; margin: 10mm; }
  @media print {
    header, .conteneur { display: none !important; }
    body { background: #fff; }
    #zone-impression { display: block; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
  #zone-impression .page { page-break-after: always; }
  #zone-impression .page:last-child { page-break-after: auto; }
  #zone-impression h1 { font-size: 16px; text-align: center; margin-bottom: 2px; }
  #zone-impression h2.sous-titre { font-size: 13px; text-align: center; font-weight: 400; color: #475569; margin-bottom: 8px; }
  #zone-impression table { border-collapse: collapse; width: 100%; }
  #zone-impression th, #zone-impression td { border: 1px solid #cbd5e1; }
  #zone-impression th { background: #f1f5f9; font-size: 10px; padding: 3px 4px; }
  #zone-impression .h-col { border: none; background: none; width: 38px; text-align: right; padding-right: 4px; font-size: 8.5px; color: #64748b; vertical-align: top; }
  #zone-impression .h-col .demi { font-size: 7px; color: #cbd5e1; }
  #zone-impression td.cr { height: 4px; padding: 0; position: relative; border-top: none; border-bottom: none; }
  #zone-impression tr.cran-30 td.cr { border-top: 1px dotted #cbd5e1; }
  #zone-impression tr.cran-60 td.cr { border-top: 1px solid #94a3b8; }
  #zone-impression td.cr .etiquette { position: absolute; top: 0; left: 2px; font-size: 7.5px; font-weight: 600; white-space: nowrap; z-index: 1; }
  #zone-impression td.mini { height: 3px; padding: 0; border-top: none; border-bottom: none; }
  #zone-impression tr.cran-30 td.mini { border-top: 1px dotted #cbd5e1; }
  #zone-impression tr.cran-60 td.mini { border-top: 1px solid #94a3b8; }
  #zone-impression tr:last-child td.cr, #zone-impression tr:last-child td.mini { border-bottom: 1px solid #94a3b8; }
  #zone-impression .legende { margin-top: 8px; font-size: 9.5px; }
  #zone-impression .legende i { width: 9px; height: 9px; }
  #zone-impression td.bloc-jour { font-size: 9.5px; padding: 3px 4px; vertical-align: top; line-height: 1.45; }
  #zone-impression td.centre { font-size: 10px; padding: 3px 4px; text-align: center; }
  #zone-impression .pied { margin-top: 6px; font-size: 8.5px; color: #94a3b8; text-align: right; }
  #zone-impression .page-bilan { page: bilan; font-size: 9.5px; color: #1e293b; }
  #zone-impression .page-bilan h1 { font-size: 17px; }
  #zone-impression .page-bilan h3 { font-size: 11px; margin: 9px 0 4px; color: #334155; }
  #zone-impression .fiche-resume { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 8px 0; }
  #zone-impression .fiche-box { border: 1px solid #cbd5e1; border-radius: 6px; padding: 5px 6px; min-height: 38px; }
  #zone-impression .fiche-box .lib { font-size: 7.8px; text-transform: uppercase; letter-spacing: .04em; color: #64748b; }
  #zone-impression .fiche-box .val { margin-top: 2px; font-size: 12px; font-weight: 700; }
  #zone-impression .fiche-note { color: #64748b; font-size: 8.5px; line-height: 1.35; margin: 3px 0 5px; }
  #zone-impression .fiche-table th { font-size: 8.3px; padding: 2px 3px; }
  #zone-impression .fiche-table td { font-size: 8.5px; padding: 2px 3px; vertical-align: top; line-height: 1.3; }
  #zone-impression .fiche-table td.muted { color: #94a3b8; text-align: center; }
  #zone-impression .fiche-solde { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 7px; }
  #recherche { font-size: 13px; padding: 6px 10px; border: 1px solid #e2e8f0; border-radius: 8px; width: 170px; }
  #res-recherche { position: fixed; top: 52px; right: 16px; z-index: 90; background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.15); max-width: 380px; max-height: 60vh; overflow-y: auto; display: none; }
  #res-recherche .res { padding: 7px 12px; font-size: 12.5px; cursor: pointer; border-bottom: 1px solid #f1f5f9; }
  #res-recherche .res:hover { background: #eff6ff; }
  #res-recherche .res b { color: #2563eb; }
  #zone-impression .doc { font-size: 12px; line-height: 1.6; color: #1e293b; max-width: 660px; margin: 0 auto; }
  #zone-impression .doc h1 { font-size: 17px; margin: 14px 0 4px; }
  #zone-impression .doc .entete-doc { display: flex; justify-content: space-between; font-size: 11px; color: #475569; border-bottom: 2px solid #1e293b; padding-bottom: 6px; }
  #zone-impression .doc table { margin: 8px 0; }
  #zone-impression .doc td, #zone-impression .doc th { padding: 4px 8px; font-size: 11px; }
</style>
<style id="page-orient"></style>
</head>
<body>

<header>
  <span style="background:#7c3aed;color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;letter-spacing:.05em">RH</span>
  <input id="titre" value="Emploi du temps AED — Vie scolaire">
  <input id="recherche" placeholder="🔍 Rechercher (AED, absence...)" autocomplete="off">
  <span class="statut-sauvegarde" id="statut"></span>
  <span class="grp-semaine">
    <select id="sel-semaine" onchange="changerSemaine(this.value)"></select>
    <button class="btn-ico" onclick="dupliquerSemaine()" title="Dupliquer la semaine courante (semaine B, semaine d'examens...)">⧉</button>
    <button class="btn-ico" onclick="renommerSemaine()" title="Renommer">✏️</button>
    <button class="btn-ico" onclick="supprimerSemaine()" title="Supprimer cette semaine">🗑</button>
  </span>
  <button class="btn-ico" onclick="annuler()" title="Annuler (Ctrl+Z)">↶</button>
  <button class="btn-ico" onclick="refaire()" title="Refaire (Ctrl+Y)">↷</button>
  <button class="btn" id="btn-json" onclick="exporter()" title="Exporter la sauvegarde JSON (recommandé chaque semaine)">💾 JSON</button>
  <button class="btn" id="btn-fichier-auto" onclick="lierFichierAuto()" title="Lier un fichier JSON : l'application y écrira automatiquement à chaque modification">🔗 Fichier auto</button>
  <button class="btn" onclick="document.getElementById('fichier').click()">📂 Importer</button>
  <button class="btn" onclick="exporterExcel()">📊 Excel</button>
  <input type="file" id="fichier" accept=".json" style="display:none" onchange="importer(event)">
  <select id="format-impression" title="Format de sortie PDF">
    <option value="aed">PDF — Un AED par page</option>
    <option value="general">PDF — Planning général</option>
    <option value="superpose">PDF — Grille superposée</option>
    <option value="jour">PDF — Affichage journalier</option>
    <option value="bilan">PDF — Fiche bilan individuelle</option>
    <option value="repartition">PDF — Fiche d'auto-répartition</option>
  </select>
  <button class="btn btn-bleu" onclick="imprimer()">🖨 Imprimer / PDF</button>
</header>

<div id="bande-annee">
  <div id="bande-sems"></div>
  <div id="bande-info"></div>
</div>

<div id="zone-impression"></div>
<div id="infobulle"></div>

<div id="res-recherche"></div>
<div id="voile">
  <div class="modal">
    <h3 id="modal-titre">Saisie manuelle</h3>
    <div class="champ"><label>Jour</label><select id="modal-jour"></select></div>
    <div class="champ"><label>Poste</label><select id="modal-poste"></select></div>
    <div class="champ"><label>Début</label><input type="time" id="modal-debut" step="300" min="07:30" max="18:30"></div>
    <div class="champ"><label>Fin</label><input type="time" id="modal-fin" step="300" min="07:30" max="18:30"></div>
    <div class="erreur" id="modal-erreur"></div>
    <div class="boutons">
      <button class="suppr" id="modal-supprimer">Supprimer</button>
      <button class="annuler" onclick="fermerModal()">Annuler</button>
      <button class="valider" onclick="validerModal()">Valider</button>
    </div>
  </div>
</div>

<div class="conteneur">
  <aside>
    <div class="carte">
      <h2>Équipe AED <button class="btn-plus" onclick="ajouterAed()">＋</button></h2>
      <div id="liste-aeds"></div>
    </div>
    <div class="carte">
      <h2>Postes <button class="btn-plus" onclick="ajouterPoste()">＋</button></h2>
      <div id="liste-postes"></div>
      <p class="aide">Sélectionnez un poste puis cliquez-glissez sur la grille. Glissez un bloc existant pour le déplacer. La gomme efface. Double-clic sur un bloc (ou une zone vide) pour saisir les horaires au clavier.</p>
    </div>
    <div class="carte">
      <h2>Alertes</h2>
      <div id="alertes"></div>
    </div>
  </aside>

  <main>
    <div class="onglets">
      <button class="onglet" id="onglet-aed" onclick="setVue('aed')">👤 Par AED</button>
      <button class="onglet" id="onglet-equipe" onclick="setVue('equipe')">👥 Synthèse équipe</button>
      <button class="onglet" id="onglet-etude" onclick="setVue('etude')">📚 Vision étude</button>
      <button class="onglet" id="onglet-absences" onclick="setVue('absences')">🗓 Absences</button>
      <button class="onglet" id="onglet-annee" onclick="setVue('annee')">📊 Année</button>
      <button class="onglet" id="onglet-dossiers" onclick="setVue('dossiers')">👤 Dossiers</button>
      <button class="onglet" id="onglet-repartition" onclick="setVue('repartition')">📋 Répartition</button>

</div>

<script>
"use strict";
// ---------- Constantes ----------
const JOURS = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi"];
const H_DEBUT = 7.5, H_FIN = 18.5;
const PAS = 5; // minutes par cran
const NB = ((H_FIN - H_DEBUT) * 60) / PAS; // nombre de crans
const PAR_30 = 30 / PAS, PAR_H = 60 / PAS;
const COULEURS = [
  { fond: "#93c5fd", texte: "#1e3a8a" }, { fond: "#6ee7b7", texte: "#064e3b" },
  { fond: "#fcd34d", texte: "#78350f" }, { fond: "#d8b4fe", texte: "#581c87" },
  { fond: "#fda4af", texte: "#881337" }, { fond: "#67e8f9", texte: "#164e63" },
  { fond: "#bef264", texte: "#365314" }, { fond: "#fdba74", texte: "#7c2d12" },
];
const CLE = "edt-aed-rh-v1"; // clé distincte : la branche RH n'écrase pas les données de l'outil planning

// Périodes Pronote et effectifs élèves présents (max observé par période, modifiable dans l'onglet Vision étude)
const PERIODES_ETUDE = [
  ["08:30", "09:25"], ["09:25", "10:40"], ["10:40", "11:35"], ["11:35", "12:30"],
  ["12:30", "13:30"], ["13:30", "14:25"], ["14:25", "15:35"], ["15:35", "16:30"],
];
let compteurId = 100;
const genId = (p) => p + (++compteurId) + "_" + (Date.now() % 100000);

// Vacances scolaires 2026-2027 (arrêté du 22/10/2025) — du premier au dernier jour sans cours
function vacancesZone(zone) {
  const hiver = { A: ["2027-02-13", "2027-02-28"], B: ["2027-02-20", "2027-03-07"], C: ["2027-02-06", "2027-02-21"] };
  const printemps = { A: ["2027-04-10", "2027-04-25"], B: ["2027-04-17", "2027-05-02"], C: ["2027-04-03", "2027-04-18"] };
  return [
    { nom: "Toussaint", du: "2026-10-17", au: "2026-11-01" },
    { nom: "Noël", du: "2026-12-19", au: "2027-01-03" },
    { nom: "Hiver", du: hiver[zone][0], au: hiver[zone][1] },
    { nom: "Printemps", du: printemps[zone][0], au: printemps[zone][1] },
    { nom: "Pont de l'Ascension", du: "2027-05-06", au: "2027-05-09" },
  ].map((v) => ({ id: genId("v"), ...v }));
}
const MOTIFS_ABSENCE = ["Maladie", "Formation", "Grève", "Garde d'enfant", "Convenance personnelle", "Autre"];
// Une absence « à rattraper » crée une dette d'heures ; maladie, formation, grève, garde d'enfant : non
const RATTRAPAGE_DEFAUT = { "Maladie": false, "Formation": false, "Grève": false, "Garde d'enfant": false, "Convenance personnelle": true, "Autre": true };
const MOTIFS_HEURES = ["Journée administrative", "Heures supplémentaires", "Remplacement", "Réunion", "Récupération", "Autre"];
const STATUTS_ABSENCE = ["Déclarée", "Justificatif reçu", "Validée", "Transmise"];
const COULEUR_STATUT = { "Déclarée": "#e11d48", "Justificatif reçu": "#d97706", "Validée": "#2563eb", "Transmise": "#059669" };

const EFFECTIFS_DEFAUT = {
  Lundi:    [48, 67, 35, 134, 398, 64, 84, 25],
  Mardi:    [86, 67, 13, 173, 398, 45, 71, 112],
  Mercredi: [71, 36, 4, 133, 398, 398, 398, 398],
  Jeudi:    [81, 78, 59, 151, 398, 18, 64, 61],
  Vendredi: [59, 69, "", 128, 398, 67, 71, 132],
};

// ---------- État ----------
let etat = {
  version: 2,
  titre: "Emploi du temps AED — Vie scolaire",
  aeds: [
    { id: "a1", nom: "AED 1", quotite: 41 },
    { id: "a2", nom: "AED 2", quotite: 41 },
    { id: "a3", nom: "AED 3", quotite: 20.5 },
  ],
  postes: [
    { id: "p1", nom: "Bureau vie scolaire", couleur: 0 },
    { id: "p2", nom: "Portail / Entrées", couleur: 1 },
    { id: "p3", nom: "Étude / Permanence", couleur: 2 },
    { id: "p4", nom: "Self", couleur: 3 },
    { id: "p5", nom: "Cour / Couloirs", couleur: 4 },
    { id: "p6", nom: "Administratif", couleur: 5 },
  ],
  planning: {}, // planning[aedId][jour][creneau] = posteId
};
let aedActif = "a1", posteActif = "p1", gomme = false, outilIndispo = false, vue = "aed";
let semaineReelle = null; // lundi (ISO) de la semaine réelle affichée, ou null = mode semaine type
let peinture = false;
let srcCopie = "Lundi", dstCopie = "Mardi";
let minuteurStatut = null;
let fichierAutoHandle = null;
let fichierAutoPret = false;
let fichierAutoTimer = null;
let fichierAutoEcriture = false;
let fichierAutoAttente = false;

// ---------- Persistance ----------
// Migration des anciens plannings (crans de 30 min → 5 min)
function migrer(d) {
  if ((d.version || 1) >= 2) return d;
  const np = {};
  for (const [aid, jours] of Object.entries(d.planning || {})) {
    np[aid] = {};
    for (const [j, crs] of Object.entries(jours)) {
      np[aid][j] = {};
      for (const [cr, pid] of Object.entries(crs)) {
        const base = parseInt(cr, 10) * (30 / PAS);
        for (let k = 0; k < 30 / PAS; k++) np[aid][j][base + k] = pid;
      }
    }
  }
  d.planning = np;
  d.version = 2;
  return d;
}

// Complète l'état avec les champs Vision étude s'ils manquent
function normaliser() {
  if (!etat.effectifs) etat.effectifs = JSON.parse(JSON.stringify(EFFECTIFS_DEFAUT));
  if (!etat.capaPrincipale) etat.capaPrincipale = 50; // salle d'étude principale
  if (!etat.capaAnnexe) etat.capaAnnexe = 20; // salles annexes
  if (!etat.absences) etat.absences = {}; // absences[aedId][jour] = 1
  if (!etat.indispos) etat.indispos = {}; // indispos[aedId][jour][cr] = 1
  if (!etat.besoins) etat.besoins = []; // besoins minimum par poste
  if (!etat.semainesTravaillees) etat.semainesTravaillees = 41;
  if (!etat.reglages) etat.reglages = { debutAnnee: "2026-09-01", finAnnee: "2027-07-02", zone: "A", vacances: vacancesZone("A") };
  if (!etat.absencesAn) etat.absencesAn = []; // registre daté : {id, aedId, du, au, motif, note, rattraper}
  for (const abs of etat.absencesAn)
    if (abs.rattraper === undefined) abs.rattraper = RATTRAPAGE_DEFAUT[abs.motif] ?? true;
  if (!etat.heuresJournal) etat.heuresJournal = []; // écritures ± : {id, aedId, date, heures, motif, note}
  // Dossier RH par AED (pas de RIB/INE/données médicales : minimisation volontaire)
  for (const a of etat.aeds) {
    if (!a.rh) a.rh = { tel: "", email: "", urgence: "", contrats: [], obs: [] };
    if (!a.rh.entretiens) a.rh.entretiens = []; // {id, date, realise, cr}
    if (!a.rh.formations) a.rh.formations = []; // {id, nom, date, validite, note}
  }
  for (const abs of etat.absencesAn)
    if (!abs.statut) abs.statut = "Déclarée";
  if (!etat.audit) etat.audit = []; // journal d'audit local {t, msg}
  if (!etat.derogations) etat.derogations = {}; // plannings spécifiques par semaine réelle : {lundiIso: planning}
  // Auto-répartition (la veille pour le lendemain) : études + créneau midi
  if (!etat.postes.some((p) => /midi/i.test(p.nom)))
    etat.postes.push({ id: genId("p"), nom: "Midi — à répartir", couleur: etat.postes.length % COULEURS.length });
  if (!etat.posteMidi || !etat.postes.find((p) => p.id === etat.posteMidi))
    etat.posteMidi = etat.postes.find((p) => /midi/i.test(p.nom))?.id || etat.postes[0]?.id;
  if (!etat.sousPostesMidi) etat.sousPostesMidi = ["Self", "Cour", "Portail / Grille"];
  if (!etat.sousPostesEtude) etat.sousPostesEtude = ["Salle principale", "Salle annexe 1", "Salle annexe 2"];
  if (!etat.reglages.midiDebut) etat.reglages.midiDebut = "11:35";
  if (!etat.reglages.midiFin) etat.reglages.midiFin = "13:30";
  if (!etat.repartitions) etat.repartitions = {}; // {dateIso: {midi: {aedId: sousPoste}, etude: {...}}}
  for (const aed of etat.aeds) {
    if (aed.contratType === undefined) aed.contratType = "CDD";
    if (aed.contratDebut === undefined) aed.contratDebut = "";
    if (aed.contratFin === undefined) aed.contratFin = "";
    if (aed.statutDepuis === undefined) aed.statutDepuis = aed.contratDebut || "";
    if (aed.telephone === undefined) aed.telephone = "";
    if (aed.email === undefined) aed.email = "";
  }
  // Variantes de semaine (A/B...) : le planning actif est etat.planning,
  // lié par référence à l'entrée active de etat.semaines
  if (!etat.semaines || !etat.semaines.length) {
    etat.semaines = [{ id: "s1", nom: "Semaine A", planning: etat.planning }];
    etat.semaineActive = "s1";
  } else {
    const act = etat.semaines.find((s) => s.id === etat.semaineActive) || etat.semaines[0];
    etat.semaineActive = act.id;
    act.planning = etat.planning;
  }
  normaliserAlternance();
  if (!etat.posteEtude || !etat.postes.find((p) => p.id === etat.posteEtude)) {
    const p = etat.postes.find((p) => /étude|etude|perman/i.test(p.nom));
    etat.posteEtude = (p || etat.postes[0])?.id;
  }
}

function normaliserAlternance() {
  if (!etat.reglages) return;
  if (!etat.reglages.alternance) etat.reglages.alternance = {};
  const alt = etat.reglages.alternance;
  const ids = etat.semaines.map((s) => s.id);
  if (!["active", "paireImpaire"].includes(alt.mode)) alt.mode = "active";
  if (!ids.includes(alt.semainePaire)) alt.semainePaire = ids[0] || "";
  if (!ids.includes(alt.semaineImpaire)) alt.semaineImpaire = ids[1] || ids[0] || "";
}

try {
  const brut = localStorage.getItem(CLE);
  if (brut) {
    const d = JSON.parse(brut);
    if (d.aeds && d.postes && d.planning) { etat = migrer(d); aedActif = d.aeds[0]?.id; posteActif = d.postes[0]?.id; }
  }
} catch (e) {}
normaliser();

function sauver() {
  try {
    localStorage.setItem(CLE, JSON.stringify(etat));
    const s = document.getElementById("statut");
    s.textContent = "✓ enregistré";
    clearTimeout(minuteurStatut);
    minuteurStatut = setTimeout(() => (s.textContent = ""), 1500);
    programmerSauvegardeFichier();
  } catch (e) {}
}

// Sauvegarde automatique sur fichier (API disponible dans Chrome/Edge).
// Le navigateur demande l'autorisation une fois, puis l'écriture est relancée à chaque modification.
function ouvrirDbFichierAuto() {
  return new Promise((ok, ko) => {
    if (!("indexedDB" in window)) { ko(); return; }
    const req = indexedDB.open("edt-aed-fichier-auto", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("kv");
    req.onsuccess = () => ok(req.result);
    req.onerror = () => ko(req.error);
  });
}
async function lireHandleFichierAuto() {
  const db = await ouvrirDbFichierAuto();
  return new Promise((ok) => {
    const req = db.transaction("kv", "readonly").objectStore("kv").get("handle");
    req.onsuccess = () => ok(req.result || null);
    req.onerror = () => ok(null);
  });
}
async function enregistrerHandleFichierAuto(handle) {
  const db = await ouvrirDbFichierAuto();
  return new Promise((ok, ko) => {
    const req = db.transaction("kv", "readwrite").objectStore("kv").put(handle, "handle");
    req.onsuccess = ok;
    req.onerror = () => ko(req.error);
  });
}
async function verifierPermissionFichier(handle, demander) {
  const opts = { mode: "readwrite" };
  if ((await handle.queryPermission(opts)) === "granted") return true;
  return demander && (await handle.requestPermission(opts)) === "granted";
}
async function initialiserSauvegardeFichier() {
  if (!("showSaveFilePicker" in window)) { majBoutonFichierAuto(); return; }
  try {
    const handle = await lireHandleFichierAuto();
    if (!handle) { majBoutonFichierAuto(); return; }
    fichierAutoHandle = handle;
    fichierAutoPret = await verifierPermissionFichier(handle, false);
    majBoutonFichierAuto();
  } catch (e) { majBoutonFichierAuto(); }
}
function majBoutonFichierAuto() {
  const btn = document.getElementById("btn-fichier-auto");
  if (!btn) return;
  if (!("showSaveFilePicker" in window)) {
    btn.textContent = "Fichier auto indisponible";
    btn.title = "Cette fonction nécessite Chrome ou Edge. Utilisez l'export JSON manuel.";
    btn.disabled = true;
    btn.style.opacity = ".55";
  } else if (fichierAutoPret) {
    btn.textContent = "✓ Fichier lié";
    btn.style.background = "#059669";
    btn.title = "Sauvegarde automatique active vers le fichier JSON choisi";
  } else if (fichierAutoHandle) {
    btn.textContent = "🔓 Réautoriser fichier";
    btn.style.background = "#b45309";
  } else {
    btn.textContent = "🔗 Fichier auto";
    btn.style.background = "";
  }
}
async function lierFichierAuto() {
  if (!("showSaveFilePicker" in window)) {
    alert("La sauvegarde automatique sur fichier nécessite Chrome ou Edge. L'export JSON manuel reste disponible.");
    return;
  }
  try {
    fichierAutoHandle = await showSaveFilePicker({
      suggestedName: "edt-aed-sauvegarde.json",
      types: [{ description: "Sauvegarde EDT AED", accept: { "application/json": [".json"] } }],
    });
    fichierAutoPret = await verifierPermissionFichier(fichierAutoHandle, true);
    if (!fichierAutoPret) return;
    await enregistrerHandleFichierAuto(fichierAutoHandle);
    majBoutonFichierAuto();
    await ecrireSauvegardeFichier(true);
  } catch (e) {
    if (e.name !== "AbortError") alert("Impossible de lier le fichier de sauvegarde.");
  }
}
function programmerSauvegardeFichier() {
  if (!fichierAutoPret || !fichierAutoHandle) return;
  clearTimeout(fichierAutoTimer);
  fichierAutoTimer = setTimeout(() => ecrireSauvegardeFichier(false), 700);
}
async function ecrireSauvegardeFichier(force) {
  if (!fichierAutoHandle || (!fichierAutoPret && !force)) return;
  if (fichierAutoEcriture) { fichierAutoAttente = true; return; }
  fichierAutoEcriture = true;
  try {
    const writable = await fichierAutoHandle.createWritable();
    await writable.write(JSON.stringify(etat, null, 2));
    await writable.close();
    const s = document.getElementById("statut");
    s.textContent = "✓ fichier sauvegardé";
    clearTimeout(minuteurStatut);
    minuteurStatut = setTimeout(() => (s.textContent = ""), 1800);
  } catch (e) {
    fichierAutoPret = false;
    majBoutonFichierAuto();
    const s = document.getElementById("statut");
    s.textContent = "⚠ fichier non autorisé";
  } finally {
    fichierAutoEcriture = false;
    if (fichierAutoAttente) {
      fichierAutoAttente = false;
      programmerSauvegardeFichier();
    }
  }
}

// ---------- Utilitaires ----------
const labelHeure = (i) => { const m = H_DEBUT * 60 + i * PAS; return Math.floor(m / 60) + "h" + String(m % 60).padStart(2, "0"); };
const fmt = (n) => Number.isInteger(n) ? String(n) : n.toFixed(1).replace(".", ",");
const fmtH = (h) => { const neg = h < 0; const m = Math.round(Math.abs(h) * 60); return (neg ? "−" : "") + Math.floor(m / 60) + "h" + String(m % 60).padStart(2, "0"); };
const classeCran = (cr) => cr % PAR_H === 0 ? "cran-60" : cr % PAR_30 === 0 ? "cran-30" : "";
const labelColonne = (cr) => cr % PAR_H === 0 ? labelHeure(cr) : cr % PAR_30 === 0 ? `<span class="demi">${labelHeure(cr)}</span>` : "";
const posteParId = (id) => etat.postes.find((p) => p.id === id);
const ech = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
function contactCourt(a) {
  const parts = [];
  if (a.telephone) parts.push("Tél. " + ech(a.telephone));
  if (a.email) parts.push(ech(a.email));
  return parts.length ? `<span class="mini-contact">${parts.join(" · ")}</span>` : "";
}

const estAbsent = (aedId, jour) => !!(etat.absences[aedId] || {})[jour];
const estIndispo = (aedId, jour, cr) => !!((etat.indispos[aedId] || {})[jour] || {})[cr];
const absenceDateAed = (aedId, iso) => etat.absencesAn.some((abs) => abs.aedId === aedId && abs.du <= iso && iso <= abs.au);
const estAbsentAlaDate = (aedId, jour, iso) => estAbsent(aedId, jour) || absenceDateAed(aedId, iso);
function heuresJour(aedId, jour) {
  if (estAbsent(aedId, jour)) return 0;
  return Object.keys((etat.planning[aedId] || {})[jour] || {}).length * PAS / 60;
}
function heuresSemaine(aedId) { return JOURS.reduce((t, j) => t + heuresJour(aedId, j), 0); }

function calculerAlertes() {
  const res = [];
  const rappelEntretien = alerteEntretienAnnuel();
  if (rappelEntretien) res.push(rappelEntretien);
  for (const aed of etat.aeds) {
    const total = heuresSemaine(aed.id);
    if (total > aed.quotite) res.push([aed.nom, "dépassement : " + fmtH(total) + " / " + fmtH(aed.quotite)]);
    if (aed.contratDebut && aed.contratFin && aed.contratFin < aed.contratDebut)
      res.push([aed.nom, "contrat incohérent : fin avant le début"]);
    if ((aed.contratType || "CDD") !== "CDI" && aed.contratDebut && !aed.contratFin)
      res.push([aed.nom, "CDD sans date de fin renseignée"]);
    if ((aed.contratType || "CDD") !== "CDI" && aed.contratFin) {
      const reste = joursAvant(aed.contratFin);
      if (reste < 0) res.push([aed.nom, "contrat terminé depuis le " + frDate(aed.contratFin)]);
      else if (reste <= 60) res.push([aed.nom, "fin de contrat le " + frDate(aed.contratFin) + " (J-" + reste + ")"]);
    }
    const limite = sixAnsApres(debutStatut(aed));
    if (limite) {
      const resteStatut = joursAvant(limite);
      if (resteStatut < 0) res.push([aed.nom, "limite des 6 ans dépassée depuis le " + frDate(limite)]);
      else if (resteStatut <= 180) res.push([aed.nom, "limite des 6 ans le " + frDate(limite) + " (J-" + resteStatut + ")"]);
    }
    for (const jour of JOURS) {
      let run = 0, maxRun = 0;
      for (let i = 0; i < NB; i++) {
        if ((etat.planning[aed.id] || {})[jour]?.[i]) { run++; maxRun = Math.max(maxRun, run); } else run = 0;
      }
      if (maxRun > 6 * PAR_H) res.push([aed.nom, jour + " : plus de 6h consécutives sans pause"]);
      if (heuresJour(aed.id, jour) > 10) res.push([aed.nom, jour + " : plus de 10h dans la journée"]);
    }
  }
  return res;
}
function alerteEntretienAnnuel(date = new Date()) {
  const iso = isoLocal(date);
  if (date.getMonth() === 2 && dansAnnee(iso))
    return ["Équipe", "mars : entretien annuel AED à planifier / réaliser"];
  return null;
}

// ---------- Historique (annuler / refaire) ----------
let pileAnnuler = [], pileRefaire = [];
const instantane = () => JSON.stringify({ p: etat.planning, i: etat.indispos });
function pousserHistorique(snap) {
  pileAnnuler.push(snap || instantane());
  if (pileAnnuler.length > 60) pileAnnuler.shift();
  pileRefaire = [];
}
function lierPlanning() {
  if (semaineReelle) { etat.derogations[semaineReelle] = etat.planning; return; }
  const act = etat.semaines.find((s) => s.id === etat.semaineActive);
  if (act) act.planning = etat.planning;
}
// En mode semaine réelle : crée la copie dérogatoire à la première modification
function assurerDerogation() {
  if (!semaineReelle || etat.derogations[semaineReelle]) {
    if (semaineReelle) etat.planning = etat.derogations[semaineReelle];
    return;
  }
  etat.derogations[semaineReelle] = JSON.parse(JSON.stringify(etat.planning || {}));
  etat.planning = etat.derogations[semaineReelle];
  journaliser(`Semaine du ${frDate(semaineReelle)} : planning spécifique créé`);
}
function restaurer(snapJson) {
  const s = JSON.parse(snapJson);
  etat.planning = s.p; etat.indispos = s.i;
  lierPlanning(); sauver(); rendre();
}
function annuler() {
  if (!pileAnnuler.length) return;
  pileRefaire.push(instantane());
  restaurer(pileAnnuler.pop());
}
function refaire() {
  if (!pileRefaire.length) return;
  pileAnnuler.push(instantane());
  restaurer(pileRefaire.pop());
}

// ---------- Actions ----------
function poserBrut(aedId, jour, cr) {
  if (gomme) {
    if (etat.planning[aedId]?.[jour]) delete etat.planning[aedId][jour][cr];
    if (etat.indispos[aedId]?.[jour]) delete etat.indispos[aedId][jour][cr];
  } else if (outilIndispo) {
    if (!etat.indispos[aedId]) etat.indispos[aedId] = {};
    if (!etat.indispos[aedId][jour]) etat.indispos[aedId][jour] = {};
    etat.indispos[aedId][jour][cr] = 1;
    if (etat.planning[aedId]?.[jour]) delete etat.planning[aedId][jour][cr];
  } else {
    if (estIndispo(aedId, jour, cr)) return; // pas de poste sur une indisponibilité
    if (!etat.planning[aedId]) etat.planning[aedId] = {};
    if (!etat.planning[aedId][jour]) etat.planning[aedId][jour] = {};
    etat.planning[aedId][jour][cr] = posteActif;
  }
}
function poser(aedId, jour, cr) {
  assurerDerogation();
  poserBrut(aedId, jour, cr);
  sauver(); rendre();
}
// Remplit tous les crans entre a et b inclus (évite les trous quand la souris va vite)
function poserPlage(aedId, jour, a, b) {
  assurerDerogation();
  for (let cr = Math.min(a, b); cr <= Math.max(a, b); cr++) poserBrut(aedId, jour, cr);
  sauver(); rendre();
}

function majAed(id, champ, val) {

function copierJour() {
  if (srcCopie === dstCopie) return;
  pousserHistorique();
  assurerDerogation();
  if (!etat.planning[aedActif]) etat.planning[aedActif] = {};
  const cible = {};
  for (const [cr, pid] of Object.entries(etat.planning[aedActif][srcCopie] || {}))
    if (!estIndispo(aedActif, dstCopie, cr)) cible[cr] = pid;

}

const semaineActive = () => etat.semaines.find((s) => s.id === etat.semaineActive);
function changerSemaine(id) {
  const cible = etat.semaines.find((s) => s.id === id);
  if (!cible) return;
  semaineReelle = null; // le sélecteur de semaine type ramène au mode type
  etat.planning = cible.planning || (cible.planning = {});
  etat.semaineActive = id;
  normaliserAlternance();
  pileAnnuler = []; pileRefaire = [];

}

// ---------- Navigation dans les semaines réelles de l'année (bandeau façon Pronote) ----------
function listeSemainesAnnee() {
  const { debutAnnee, finAnnee } = etat.reglages;
  const res = [];
  let lundi = lundiDeSemaine(debutAnnee);
  let garde = 0;
  while (lundi <= finAnnee && garde++ < 60) {
    let joursCours = 0;
    const d = new Date(lundi + "T12:00:00");
    for (let k = 0; k < 5; k++) {
      const iso = isoLocal(d);
      if (dansAnnee(iso) && !estFerie(iso) && !estVacancesIso(iso)) joursCours++;
      d.setDate(d.getDate() + 1);
    }
    res.push({ lundi, num: numeroSemaineIso(lundi), vacances: joursCours === 0, variante: nomSemainePourDate(lundi), derogee: !!etat.derogations[lundi] });
    const suivant = new Date(lundi + "T12:00:00");
    suivant.setDate(suivant.getDate() + 7);
    lundi = isoLocal(suivant);
  }
  return res;
}
function choisirSemaineReelle(lundi) {
  semaineReelle = lundi;
  etat.planning = etat.derogations[lundi] || semainePourDate(lundi)?.planning || {};
  pileAnnuler = []; pileRefaire = [];
  rendre();
}
function modeType() {
  semaineReelle = null;
  etat.planning = semaineActive()?.planning || {};
  pileAnnuler = []; pileRefaire = [];
  rendre();
}
function reinitialiserSemaine() {
  if (!semaineReelle || !etat.derogations[semaineReelle]) return;
  if (!confirm(`Supprimer les modifications de la semaine du ${frDate(semaineReelle)} et revenir à la semaine type ?`)) return;
  delete etat.derogations[semaineReelle];
  journaliser(`Semaine du ${frDate(semaineReelle)} réinitialisée sur la semaine type`);
  etat.planning = semainePourDate(semaineReelle)?.planning || {};
  sauver(); rendre();
}
function rendreBande() {
  const sems = listeSemainesAnnee();
  const lundiAuj = lundiDeSemaine(aujourdhuiIso());
  document.getElementById("bande-sems").innerHTML =
    `<button class="sem-btn type-btn${semaineReelle === null ? " choisi" : ""}" onclick="modeType()" title="Éditer les semaines types (A/B)">Type</button>` +
    sems.map((s) => {
      const vendredi = new Date(s.lundi + "T12:00:00"); vendredi.setDate(vendredi.getDate() + 4);
      const titre = `Semaine ${s.num} · du ${frDate(s.lundi)} au ${frDate(isoLocal(vendredi))}${s.vacances ? " · vacances" : " · base " + s.variante}${s.derogee ? " · modifiée" : ""}`;
      const classes = ["sem-btn"];
      if (s.vacances) classes.push("vac");
      else if (/^b/i.test((s.variante || "").replace(/semaine/i, "").trim())) classes.push("varB");
      if (semaineReelle === s.lundi) classes.push("choisi");
      if (s.lundi === lundiAuj) classes.push("auj");
      return `<button class="${classes.join(" ")}" onclick="choisirSemaineReelle('${s.lundi}')" title="${ech(titre)}">${s.vacances ? "F" : s.num}${s.derogee ? '<span class="derog"></span>' : ""}</button>`;
    }).join("");
  const info = document.getElementById("bande-info");
  if (semaineReelle === null) {
    info.innerHTML = `Mode <b>semaine type</b> : vous éditez le modèle « ${ech(semaineActive()?.nom || "")} ». Cliquez une semaine du bandeau pour voir ou modifier une semaine précise de l'année (● rouge = semaine modifiée).`;
  } else {
    const vendredi = new Date(semaineReelle + "T12:00:00"); vendredi.setDate(vendredi.getDate() + 4);
    const derogee = !!etat.derogations[semaineReelle];
    info.innerHTML = `Semaine du <b>${frDate(semaineReelle)}</b> au <b>${frDate(isoLocal(vendredi))}</b> · base : ${ech(nomSemainePourDate(semaineReelle))}
      ${derogee ? `· <b style="color:#e11d48">modifiée</b> <button class="btn-reset" onclick="reinitialiserSemaine()">Revenir à la semaine type</button>`
        : `· conforme à la semaine type — toute modification créera une version spécifique de cette semaine`}`;
  }
}
// ---------- Auto-répartition études / midi (la veille pour le lendemain) ----------
const estAbsenteDate = (aedId, iso) =>
  etat.absencesAn.some((a) => a.aedId === aedId && a.du <= iso && iso <= a.au);

function datesSemaineAffichee() {
  const lundi = semaineReelle || lundiDeSemaine(aujourdhuiIso());
  const res = [];
  const d = new Date(lundi + "T12:00:00");
  for (let k = 0; k < 5; k++) { res.push(isoLocal(d)); d.setDate(d.getDate() + 1); }
  return res;
}
// AED postés sur un poste donné entre deux crans, pour une date réelle
function candidatsBande(iso, posteId, crA, crB) {
  const plan = planningPourDate(iso);
  const jourNom = JOURS[(new Date(iso + "T12:00:00").getDay() + 6) % 7];
  return etat.aeds.filter((a) => {
    if (estAbsenteDate(a.id, iso)) return false;
    const jour = (plan[a.id] || {})[jourNom] || {};
    for (let cr = crA; cr < crB; cr++) if (jour[cr] === posteId) return true;
    return false;
  });
}
function majRepartition(iso, bande, aedId, val) {
  if (!etat.repartitions[iso]) etat.repartitions[iso] = {};
  if (!etat.repartitions[iso][bande]) etat.repartitions[iso][bande] = {};
  if (val) etat.repartitions[iso][bande][aedId] = val;
  else delete etat.repartitions[iso][bande][aedId];
  sauver(); rendre();
}
function majSousPostes(champ, val) {
  etat[champ] = val.split(",").map((s) => s.trim()).filter(Boolean);
  if (!etat[champ].length) etat[champ] = ["Self"];
  sauver(); rendre();
}
function majPosteMidi(id) { etat.posteMidi = id; sauver(); rendre(); }
function majMidiHoraire(champ, val) { if (val) { etat.reglages[champ] = val; sauver(); rendre(); } }

function blocsRepartition(iso) {
  const crA = heureVersCr(etat.reglages.midiDebut), crB = heureVersCr(etat.reglages.midiFin);
  return [
    { bande: "etude", titre: "Études", sousPostes: etat.sousPostesEtude, candidats: candidatsBande(iso, etat.posteEtude, 0, NB) },
    { bande: "midi", titre: `Midi ${etat.reglages.midiDebut.replace(":", "h")}–${etat.reglages.midiFin.replace(":", "h")}`, sousPostes: etat.sousPostesMidi, candidats: candidatsBande(iso, etat.posteMidi, crA, crB) },
  ];
}

// ---------- Export / import ----------
function telechargerJson(data, nomFichier) {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = nomFichier; a.click();
  URL.revokeObjectURL(url);
}

function journaliser(msg) {
  (etat.audit = etat.audit || []).push({ t: Date.now(), msg });
  if (etat.audit.length > 300) etat.audit.shift();
}
function exporter() {
  etat.dernierExport = Date.now();
  journaliser("Export JSON manuel");
  sauver();
  telechargerJson(etat, "edt-aed-rh.json");
}
function importer(e) {
  const f = e.target.files[0]; if (!f) return;
  const lecteur = new FileReader();
  lecteur.onload = () => {
    try {
      const d = JSON.parse(lecteur.result);
      if (d.aeds && d.postes && d.planning) {
        etat = migrer(d); aedActif = d.aeds[0]?.id; posteActif = d.postes[0]?.id;
        normaliser();
        sauver(); rendre();
      } else alert("Fichier invalide.");
    } catch (err) { alert("Fichier illisible."); }
  };
  lecteur.readAsText(f);
  e.target.value = "";
}

// ---------- Rendu ----------

  document.getElementById("sel-semaine").innerHTML =

  document.getElementById("onglet-annee").className = "onglet" + (vue === "annee" ? " actif" : "");
  document.getElementById("onglet-dossiers").className = "onglet" + (vue === "dossiers" ? " actif" : "");
  document.getElementById("onglet-repartition").className = "onglet" + (vue === "repartition" ? " actif" : "");

    vue === "etude" ? htmlVisionEtude() :
    vue === "absences" ? htmlAbsences() :
    vue === "annee" ? htmlAnnee() :
    vue === "dossiers" ? htmlDossiers() :
    vue === "repartition" ? htmlRepartition() :
    vue === "mois" ? htmlMois() :
    vue === "reglages" ? htmlReglages() : htmlSynthese();
  // rappel de sauvegarde : point rouge sur le bouton JSON si > 7 jours sans export
  const retard = !etat.dernierExport || Date.now() - etat.dernierExport > 7 * 864e5;
  document.getElementById("btn-json").style.boxShadow = retard ? "0 0 0 2px #fda4af" : "none";
  majBoutonFichierAuto();
}

// ---------- Calendrier (fériés, vacances, décompte des absences) ----------
const isoLocal = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const frDate = (iso) => { const [y, m, d] = iso.split("-"); return d + "/" + m + "/" + y; };
function paques(annee) { // algorithme de Gauss/Butcher
  const a = annee % 19, b = Math.floor(annee / 100), c = annee % 100;
  const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  return new Date(annee, Math.floor((h + l - 7 * m + 114) / 31) - 1, ((h + l - 7 * m + 114) % 31) + 1);
}
function feriesAnnee(annee) {
  const p = paques(annee), plus = (n) => { const d = new Date(p); d.setDate(d.getDate() + n); return isoLocal(d); };
  return [
    [`${annee}-01-01`, "Jour de l'an"], [plus(1), "Lundi de Pâques"], [`${annee}-05-01`, "Fête du Travail"],
    [`${annee}-05-08`, "Victoire 1945"], [plus(39), "Ascension"], [plus(50), "Lundi de Pentecôte"],
    [`${annee}-07-14`, "Fête nationale"], [`${annee}-08-15`, "Assomption"], [`${annee}-11-01`, "Toussaint"],
    [`${annee}-11-11`, "Armistice"], [`${annee}-12-25`, "Noël"],
  ];
}
function feriesAnneeScolaire() {
  const { debutAnnee, finAnnee } = etat.reglages;
  const annees = [...new Set([+debutAnnee.slice(0, 4), +finAnnee.slice(0, 4)])];
  return annees.flatMap(feriesAnnee).filter(([iso]) => iso >= debutAnnee && iso <= finAnnee).sort();
}
const estFerie = (iso) => feriesAnneeScolaire().some(([f]) => f === iso);
const estVacancesIso = (iso) => etat.reglages.vacances.some((v) => v.du <= iso && iso <= v.au);
const dansAnnee = (iso) => etat.reglages.debutAnnee <= iso && iso <= etat.reglages.finAnnee;
function numeroSemaineIso(iso) {
  const d = new Date(iso + "T12:00:00");
  d.setDate(d.getDate() + 4 - (d.getDay() || 7));
  const debut = new Date(d.getFullYear(), 0, 1);
  return Math.ceil((((d - debut) / 864e5) + 1) / 7);
}
function semainePourDate(iso) {
  const alt = etat.reglages.alternance || {};
  if (iso && alt.mode === "paireImpaire") {
    const id = numeroSemaineIso(iso) % 2 === 0 ? alt.semainePaire : alt.semaineImpaire;
    return etat.semaines.find((s) => s.id === id) || semaineActive() || etat.semaines[0];
  }
  return semaineActive() || etat.semaines[0];
}
const lundiDeSemaine = (iso) => {
  const d = new Date(iso + "T12:00:00");
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return isoLocal(d);
};
function planningPourDate(iso) {
  if (iso && etat.derogations) {
    const der = etat.derogations[lundiDeSemaine(iso)];
    if (der) return der; // semaine réelle modifiée : elle prime sur la semaine type
  }
  return (semainePourDate(iso)?.planning) || etat.planning || {};
}
function nomSemainePourDate(iso) {
  const sem = semainePourDate(iso);
  return sem ? sem.nom : "";
}
// heures du planning type pour un jour de semaine (indépendant de la case "absent")
const heuresPlanifiees = (aedId, jourNom, iso) =>
  Object.keys((planningPourDate(iso)[aedId] || {})[jourNom] || {}).length * PAS / 60;
function heuresPlanifieesEntre(aedId, duIso, auIso) {
  if (!duIso || !auIso || auIso < duIso) return 0;
  let total = 0, garde = 0;
  const d = new Date(duIso + "T12:00:00");
  const fin = new Date(auIso + "T12:00:00");
  while (d <= fin && garde++ < 500) {
    const iso = isoLocal(d);
    const idxJour = (d.getDay() + 6) % 7;
    if (idxJour < 5 && dansAnnee(iso) && !estFerie(iso) && !estVacancesIso(iso))
      total += heuresPlanifiees(aedId, JOURS[idxJour], iso);
    d.setDate(d.getDate() + 1);
  }
  return total;
}

// jours effectivement décomptés pour une absence datée
function joursDecomptes(abs) {
  const res = [];
  const d = new Date(abs.du + "T12:00:00");
  const fin = new Date(abs.au + "T12:00:00");
  let garde = 0;
  while (d <= fin && garde++ < 400) {
    const iso = isoLocal(d);
    const idxJour = (d.getDay() + 6) % 7; // 0 = Lundi
    if (idxJour < 5 && dansAnnee(iso) && !estFerie(iso) && !estVacancesIso(iso)) {
      const jourNom = JOURS[idxJour];
      res.push({ iso, jourNom, semaine: nomSemainePourDate(iso), heures: heuresPlanifiees(abs.aedId, jourNom, iso) });
    }
    d.setDate(d.getDate() + 1);
  }
  return res;
}

// ---------- Journal des heures ± et bilan annuel ----------
const aujourdhuiIso = () => isoLocal(new Date());
// nombre de jours de cours (lun-ven, hors fériés et vacances) entre deux dates incluses
function joursCoursEntre(duIso, auIso) {
  if (!duIso || !auIso || auIso < duIso) return 0;
  let n = 0, garde = 0;
  const d = new Date(duIso + "T12:00:00");
  const fin = new Date(auIso + "T12:00:00");
  while (d <= fin && garde++ < 500) {
    const iso = isoLocal(d);
    const idxJour = (d.getDay() + 6) % 7;
    if (idxJour < 5 && dansAnnee(iso) && !estFerie(iso) && !estVacancesIso(iso)) n++;
    d.setDate(d.getDate() + 1);
  }
  return n;
}
const maxIso = (...dates) => dates.filter(Boolean).sort().at(-1) || "";
const minIso = (...dates) => dates.filter(Boolean).sort()[0] || "";
function debutContrat(a) { return a.contratDebut || etat.reglages.debutAnnee; }
function finContrat(a) { return a.contratFin || etat.reglages.finAnnee; }
function debutStatut(a) { return a.statutDepuis || a.contratDebut || ""; }
function borneContratAnnee(a) {
  const debut = maxIso(etat.reglages.debutAnnee, debutContrat(a));
  const fin = minIso(etat.reglages.finAnnee, finContrat(a));
  return { debut, fin, actif: debut && fin && debut <= fin };
}
function dateDansContrat(a, iso) {
  return iso >= debutContrat(a) && iso <= finContrat(a);
}
function semainesContrat(a, jusquaIso) {
  const b = borneContratAnnee(a);
  if (!b.actif) return 0;
  const fin = jusquaIso ? minIso(b.fin, jusquaIso) : b.fin;
  return fin >= b.debut ? joursCoursEntre(b.debut, fin) / 5 : 0;
}
function sixAnsApres(iso) {
  if (!iso) return "";
  const d = new Date(iso + "T12:00:00");
  d.setFullYear(d.getFullYear() + 6);
  return isoLocal(d);
}
function joursAvant(iso) {
  if (!iso) return Infinity;
  const d = new Date(iso + "T12:00:00");
  const auj = new Date(aujourdhuiIso() + "T12:00:00");
  return Math.ceil((d - auj) / 864e5);
}
function contratLibelle(a) {
  const debut = a.contratDebut ? frDate(a.contratDebut) : frDate(etat.reglages.debutAnnee);
  if (a.contratType === "CDI") return "CDI depuis " + debut;
  return "CDD " + debut + " → " + (a.contratFin ? frDate(a.contratFin) : "fin non renseignée");
}

function ajouterEcriture() {
  const aedId = document.getElementById("ecr-aed").value;
  const date = document.getElementById("ecr-date").value;
  const motif = document.getElementById("ecr-motif").value;
  let heures = parseFloat(document.getElementById("ecr-heures").value);
  const note = document.getElementById("ecr-note").value.trim();
  if (!aedId || !date || !heures) { alert("Choisissez un AED, une date et une durée non nulle."); return; }
  if (motif === "Récupération" && heures > 0) heures = -heures; // une récup se décompte
  etat.heuresJournal.push({ id: genId("e"), aedId, date, heures, motif, note });
  journaliser(`Écriture ${motif} ${heures > 0 ? "+" : ""}${heures}h : ${etat.aeds.find((x) => x.id === aedId)?.nom}`);
  sauver(); rendre();
}
function supprimerEcriture(id) { etat.heuresJournal = etat.heuresJournal.filter((e) => e.id !== id); sauver(); rendre(); }

function bilanAed(a) {
  const auj = aujourdhuiIso();
  const { finAnnee } = etat.reglages;
  const finComptee = auj < finAnnee ? auj : finAnnee;
  const bornes = borneContratAnnee(a);
  const semEcoulees = semainesContrat(a, finComptee);
  const semTotales = semainesContrat(a);
  const finADate = bornes.actif ? minIso(bornes.fin, finComptee) : "";
  const planifieADate = bornes.actif && finADate >= bornes.debut ? heuresPlanifieesEntre(a.id, bornes.debut, finADate) : 0;
  const planifieTotal = bornes.actif ? heuresPlanifieesEntre(a.id, bornes.debut, bornes.fin) : 0;
  const hebdo = semTotales ? planifieTotal / semTotales : JOURS.reduce((t, j) => t + heuresPlanifiees(a.id, j), 0);
  let absADate = 0, absTotal = 0;
  // seules les absences « à rattraper » créent une dette (maladie, formation... : service réputé fait)
  for (const abs of etat.absencesAn.filter((x) => x.aedId === a.id && x.rattraper))
    for (const j of joursDecomptes(abs)) {
      if (!dateDansContrat(a, j.iso)) continue;
      absTotal += j.heures;
      if (j.iso <= auj) absADate += j.heures;
    }
  let jrnADate = 0, jrnTotal = 0, adminH = 0, adminN = 0;
  for (const e of etat.heuresJournal.filter((x) => x.aedId === a.id)) {
    if (!dateDansContrat(a, e.date)) continue;
    jrnTotal += e.heures;
    if (e.date <= auj) jrnADate += e.heures;
    if (e.motif === "Journée administrative") { adminH += e.heures; adminN++; }
  }
  const du = a.quotite * semTotales;
  const realise = planifieADate - absADate + jrnADate;
  const projection = planifieTotal - absTotal + jrnTotal;
  return { hebdo, semEcoulees, semTotales, planifieADate, planifieTotal, absADate, absTotal, jrnADate, jrnTotal, adminH, adminN, du, realise, projection, ecart: projection - du };
}

function htmlAnnee() {
  const auj = aujourdhuiIso();

  const lignesJournal = etat.heuresJournal.slice().sort((a, b) => b.date.localeCompare(a.date)).map((e) => {

      <td class="centre" style="color:${b.jrnTotal >= 0 ? "#059669" : "#e11d48"}">${b.jrnTotal ? (b.jrnTotal > 0 ? "+" : "−") + fmtH(Math.abs(b.jrnTotal)) : "—"}</td>
      <td class="centre" style="font-weight:600">${fmtH(b.projection)}</td>

  return `<div class="carte" style="margin-bottom:14px">

    Mode planning : <b>${alternanceAuto ? "alternance paire/impaire du calendrier" : "semaine affichée"}</b>.
    Les journées administratives — permanences pendant les vacances, qui font partie du service des AED — se saisissent dans le journal ci-dessous.</p>
  </div>
  <div class="carte" style="margin-bottom:14px">
    <h3 style="font-size:15px;margin-bottom:8px">Journal des heures ± (journées administratives, heures supplémentaires, récupérations…)</h3>
    <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:10px">
      <label style="font-size:12px;color:#475569">AED<br><select id="ecr-aed" style="font-size:13px">${etat.aeds.map((a) => `<option value="${a.id}">${ech(a.nom)}</option>`).join("")}</select></label>
      <label style="font-size:12px;color:#475569">Date<br><input type="date" id="ecr-date" min="${debutAnnee}" max="${finAnnee}" style="font-size:13px"></label>
      <label style="font-size:12px;color:#475569">Motif<br><select id="ecr-motif" style="font-size:13px">${MOTIFS_HEURES.map((m) => `<option>${m}</option>`).join("")}</select></label>
      <label style="font-size:12px;color:#475569">Heures<br><input type="number" id="ecr-heures" step="0.25" placeholder="7 ou -2" style="font-size:13px;width:78px"></label>

  </div>

      <thead><tr><th style="text-align:left">AED</th><th>Contrat</th><th>Sem. dues</th><th>${alternanceAuto ? "Hebdo moyen" : "Hebdo posé"}</th><th>Dû annuel</th><th>Réalisé à date</th><th>Abs. à rattraper (à date)</th><th>J. admin</th><th>Journal ±</th><th>Projection</th><th>Écart projeté</th></tr></thead>
      <tbody>${lignesBilan}</tbody>
    </table>

function ajouterContrat(aedId) {

  a.rh.contrats.push({ id: genId("c"), type: "CDD", du: etat.reglages.debutAnnee, au: etat.reglages.finAnnee, quotite: a.quotite, finEssai: "", note: "" });

}

function majStatutAbsence(id, statut) {

  if (abs) { abs.statut = statut; journaliser(`Absence ${statut.toLowerCase()}`); sauver(); rendre(); }
}

function appliquerContrat(aedId, cId) {
  const a = etat.aeds.find((x) => x.id === aedId);
  const c = a?.rh.contrats.find((x) => x.id === cId);
  if (!c) return;
  a.contratType = c.type;
  a.contratDebut = c.du || "";
  a.contratFin = c.type === "CDI" ? "" : (c.au || "");
  if (c.quotite) a.quotite = c.quotite;
  journaliser(`Contrat en cours mis à jour pour ${a.nom} (${c.type} ${c.du || "?"})`);
  sauver(); rendre();
}
function supprimerContrat(aedId, cId) {
  const a = etat.aeds.find((x) => x.id === aedId);
  if (!a || !confirm("Supprimer ce contrat de l'historique ?")) return;
  a.rh.contrats = a.rh.contrats.filter((c) => c.id !== cId);
  sauver(); rendre();
}
function ajouterObs(aedId) {

  if (a) { a.rh.obs = a.rh.obs.filter((o) => o.id !== oId); sauver(); rendre(); }
}

const contratActif = (a, iso) => (a.rh?.contrats || []).find((c) => c.du && c.du <= iso && (c.type === "CDI" || !c.au || iso <= c.au));

// Alertes complémentaires (fins de contrat, 6 ans et entretiens sont déjà dans les alertes latérales)
function alertesRh() {
  const res = [];
  for (const a of etat.aeds) {
    const rh = a.rh || {};
    for (const c of rh.contrats || []) {
      if (c.finEssai) {
        const reste = joursAvant(c.finEssai);
        if (reste >= 0 && reste <= 15) res.push([a.nom, `fin de période d'essai le ${frDate(c.finEssai)} (J-${reste})`, "#e11d48"]);
      }
    }
    for (const f of rh.formations || []) {
      if (f.validite) {
        const reste = joursAvant(f.validite);
        if (reste < 0) res.push([a.nom, `formation ${f.nom} expirée depuis le ${frDate(f.validite)}`, "#e11d48"]);
        else if (reste <= 60) res.push([a.nom, `formation ${f.nom} expire le ${frDate(f.validite)} (J-${reste})`, "#d97706"]);
      }
    }
    // entretien annuel : alerte à partir de mars si aucun entretien réalisé dans l'année scolaire
    const auj = aujourdhuiIso();
    if (dansAnnee(auj) && new Date().getMonth() >= 2 && new Date().getMonth() <= 6) {
      const fait = (rh.entretiens || []).some((e) => e.realise && dansAnnee(e.date));
      if (!fait) res.push([a.nom, "entretien annuel non réalisé", "#d97706"]);
    }
    if (!a.telephone) res.push([a.nom, "dossier incomplet : téléphone manquant", "#d97706"]);
  }
  const aRegulariser = etat.absencesAn.filter((x) => x.statut === "Déclarée").length;
  if (aRegulariser) res.push(["Équipe", `${aRegulariser} absence(s) au statut « Déclarée » à régulariser (🗓 Absences)`, "#d97706"]);
  return res;
}

function majReglage(champ, val) { if (val) etat.reglages[champ] = val; sauver(); rendre(); }
function majZone(z) { etat.reglages.zone = z; sauver(); rendre(); }
function majAlternance(champ, val) {

  normaliserAlternance();
  sauver(); rendre();
}
function rechargerVacances() {
  if (!confirm(`Remplacer la liste des vacances par celles de la zone ${etat.reglages.zone} (2026-2027) ?`)) return;
  etat.reglages.vacances = vacancesZone(etat.reglages.zone);
  sauver(); rendre();
}
function ajouterVacance() {
  etat.reglages.vacances.push({ id: genId("v"), nom: "Période", du: etat.reglages.debutAnnee, au: etat.reglages.debutAnnee });
  sauver(); rendre();
}
function majVacance(id, champ, val) {
  const v = etat.reglages.vacances.find((x) => x.id === id);
  if (v && val) { v[champ] = val; sauver(); rendre(); }
}
function supprimerVacance(id) {
  etat.reglages.vacances = etat.reglages.vacances.filter((v) => v.id !== id);
  sauver(); rendre();
}

function ajouterAnneesIso(iso, n) {
  if (!iso) return "";
  const d = new Date(iso + "T12:00:00");
  d.setFullYear(d.getFullYear() + n);
  return isoLocal(d);
}
function horodatageFichier(d = new Date()) {
  return isoLocal(d).replace(/-/g, "") + "-" + String(d.getHours()).padStart(2, "0") + String(d.getMinutes()).padStart(2, "0");
}
function anneeScolaireLibelle(r = etat.reglages) {
  return (r.debutAnnee || "").slice(0, 4) + "-" + (r.finAnnee || "").slice(0, 4);
}
function preparerEtatAnneeSuivante() {
  const ancien = JSON.parse(JSON.stringify(etat));
  const debutAnnee = ajouterAnneesIso(ancien.reglages.debutAnnee, 1);
  const finAnnee = ajouterAnneesIso(ancien.reglages.finAnnee, 1);
  const semaines = (ancien.semaines && ancien.semaines.length ? ancien.semaines : [{ id: "s1", nom: "Semaine A" }])
    .map((s) => ({ id: s.id, nom: s.nom, planning: {} }));
  const semaineActiveId = semaines.find((s) => s.id === ancien.semaineActive)?.id || semaines[0]?.id || "s1";
  const planningActif = semaines.find((s) => s.id === semaineActiveId)?.planning || {};
  const reglages = {
    ...ancien.reglages,
    debutAnnee,
    finAnnee,
    vacances: (ancien.reglages.vacances || []).map((v) => ({
      ...v,
      id: genId("v"),
      du: ajouterAnneesIso(v.du, 1),
      au: ajouterAnneesIso(v.au, 1),
    })),
  };
  return {
    ...ancien,
    titre: ancien.titre,
    aeds: ancien.aeds.map((a) => ({
      ...a,
      contratDebut: debutAnnee,
      contratFin: a.contratType === "CDI" ? "" : finAnnee,
    })),
    postes: ancien.postes,
    planning: planningActif,
    semaines,
    semaineActive: semaineActiveId,
    absences: {},
    indispos: {},
    absencesAn: [],
    heuresJournal: [],
    besoins: [],
    effectifs: JSON.parse(JSON.stringify(EFFECTIFS_DEFAUT)),
    reglages,
    dernierExport: null,
  };
}
function cloturerAnnee() {
  const annee = anneeScolaireLibelle();
  if (!confirm(`Clôturer l'année scolaire ${annee} ?\n\nUne archive JSON complète sera téléchargée, puis l'application repartira sur l'année suivante avec l'équipe et les postes conservés.`)) return;

    ...JSON.parse(JSON.stringify(etat)),

      type: "cloture-annee-edt-aed",

      anneeScolaire: annee,
    },
  };

  aedActif = etat.aeds[0]?.id;
  posteActif = etat.postes[0]?.id;
  vue = "reglages";
  pileAnnuler = []; pileRefaire = [];
  sauver(); rendre();
  alert("Année clôturée. Les vacances ont été décalées d'un an automatiquement : pensez à les vérifier dans Réglages.");
}

// ---------- Remplacements ----------
function calculRemplacements() {
  const res = [];
  for (const aed of etat.aeds) {
    for (const jour of JOURS) {
      if (!estAbsent(aed.id, jour)) continue;
      for (const b of blocs(aed.id, jour)) {
        const candidats = etat.aeds
          .filter((c) => {
            if (c.id === aed.id || estAbsent(c.id, jour)) return false;
            for (let cr = b.debut; cr < b.fin; cr++)
              if ((etat.planning[c.id] || {})[jour]?.[cr] || estIndispo(c.id, jour, cr)) return false;
            return true;
          })
          .map((c) => ({ aed: c, nom: c.nom, marge: c.quotite - heuresSemaine(c.id) }))
          .sort((x, y) => y.marge - x.marge);
        res.push({ nom: aed.nom, jour, b, poste: posteParId(b.pid), candidats });
      }
    }
  }
  return res;
}

function contexteMaintenant(date = new Date()) {
  const iso = isoLocal(date);
  const idxJour = (date.getDay() + 6) % 7;
  if (idxJour >= 5) return { ok: false, iso, message: "Week-end : aucun créneau de service aujourd'hui." };
  const minutes = date.getHours() * 60 + date.getMinutes();
  const debut = H_DEBUT * 60, fin = H_FIN * 60;
  if (minutes < debut || minutes >= fin) return { ok: false, iso, message: "Hors amplitude horaire de la grille." };
  if (!dansAnnee(iso)) return { ok: false, iso, message: "Date hors année scolaire réglée dans l'application." };
  if (estFerie(iso)) return { ok: false, iso, message: "Jour férié : aucun service ordinaire à couvrir." };
  if (estVacancesIso(iso)) return { ok: false, iso, message: "Vacances scolaires : aucun service ordinaire à couvrir." };
  return { ok: true, iso, jour: JOURS[idxJour], cr: Math.floor((minutes - debut) / PAS) };
}

function analyserLibresMaintenant(date = new Date()) {
  const ctx = contexteMaintenant(date);
  if (!ctx.ok) return ctx;
  const planning = planningPourDate(ctx.iso);
  const libres = [], occupes = [], absents = [], indispos = [], horsContrat = [];
  for (const aed of etat.aeds) {
    if (!dateDansContrat(aed, ctx.iso)) { horsContrat.push(aed); continue; }
    if (estAbsentAlaDate(aed.id, ctx.jour, ctx.iso)) { absents.push(aed); continue; }
    if (estIndispo(aed.id, ctx.jour, ctx.cr)) { indispos.push(aed); continue; }
    const pid = (planning[aed.id] || {})[ctx.jour]?.[ctx.cr];
    if (pid) occupes.push({ aed, poste: posteParId(pid) });
    else libres.push({ aed, marge: aed.quotite - heuresSemaine(aed.id) });
  }
  libres.sort((a, b) => b.marge - a.marge || a.aed.nom.localeCompare(b.aed.nom));
  return { ...ctx, semaine: nomSemainePourDate(ctx.iso), libres, occupes, absents, indispos, horsContrat };
}

function ajouterBesoin() {

  sauver(); rendre();
}
function majBesoin(id, champ, val) {
  const b = etat.besoins.find((x) => x.id === id);
  if (!b) return;
  b[champ] = champ === "n" ? Math.max(1, parseInt(val, 10) || 1) : val;
  sauver(); rendre();
}
function supprimerBesoin(id) { etat.besoins = etat.besoins.filter((b) => b.id !== id); sauver(); rendre(); }
function minPoste(jour, posteId, crA, crB) {
  let mn = Infinity;
  for (let cr = crA; cr < crB; cr++) {
    const c = etat.aeds.filter((a) => !estAbsent(a.id, jour) && (etat.planning[a.id] || {})[jour]?.[cr] === posteId).length;
    mn = Math.min(mn, c);
  }
  return crB > crA ? mn : 0;
}
function htmlBesoins() {
  const lignes = etat.besoins.map((b) => {
    const crA = heureVersCr(b.debut), crB = heureVersCr(b.fin);
    const jours = b.jour === "Tous" ? JOURS : [b.jour];
    const couverture = JOURS.map((j) => {
      if (!jours.includes(j)) return `<td class="centre" style="color:#cbd5e1">·</td>`;
      const m = crB > crA ? minPoste(j, b.posteId, crA, crB) : 0;

// ---------- Peinture (délégation) ----------
let debutPeinture = null, dernierPeint = null;
let deplacementBloc = null;
let clicheAvant = null; // état avant le 1er clic (pour annuler la peinture d'un double-clic)
let dernierClic = { t: 0, jour: null, cr: -1 };

function blocAutour(aedId, jour, cr) {
  const plan = (etat.planning[aedId] || {})[jour] || {};
  const pid = plan[cr];
  if (!pid) return null;
  let a = cr, b = cr;
  while (a > 0 && plan[a - 1] === pid) a--;
  while (b < NB - 1 && plan[b + 1] === pid) b++;
  return { jour, a, b: b + 1, pid };
}
function nettoyerCibleDeplacement() {
  document.querySelectorAll("#grille td.deplacement-cible").forEach((td) => td.classList.remove("deplacement-cible"));
}
function marquerCibleDeplacement() {
  nettoyerCibleDeplacement();
  if (!deplacementBloc) return;
  for (let cr = deplacementBloc.cibleA; cr < deplacementBloc.cibleB; cr++) {
    const td = document.querySelector(`#grille td.creneau[data-jour="${deplacementBloc.cibleJour}"][data-cr="${cr}"]`);
    if (td) td.classList.add("deplacement-cible");
  }
}
function deplacementValide(ctx) {
  for (let cr = ctx.cibleA; cr < ctx.cibleB; cr++) {
    if (estIndispo(aedActif, ctx.cibleJour, cr)) return false;
    const occupe = (etat.planning[aedActif] || {})[ctx.cibleJour]?.[cr];
    const source = ctx.cibleJour === ctx.jourOrigine && cr >= ctx.a && cr < ctx.b;
    if (occupe && !source) return false;
  }
  return true;
}
function terminerDeplacementBloc() {
  if (!deplacementBloc) return;
  const ctx = deplacementBloc;
  nettoyerCibleDeplacement();
  deplacementBloc = null;
  const identique = ctx.cibleJour === ctx.jourOrigine && ctx.cibleA === ctx.a;
  if (!ctx.deplace || identique) return;
  if (!deplacementValide(ctx)) {
    alert("Déplacement impossible : la destination contient déjà un bloc ou une indisponibilité.");
    return;
  }
  pousserHistorique(ctx.snap);
  const plan = (etat.planning[aedActif] || {})[ctx.jourOrigine];
  if (plan) for (let cr = ctx.a; cr < ctx.b; cr++) delete plan[cr];
  if (!etat.planning[aedActif]) etat.planning[aedActif] = {};
  if (!etat.planning[aedActif][ctx.cibleJour]) etat.planning[aedActif][ctx.cibleJour] = {};
  for (let cr = ctx.cibleA; cr < ctx.cibleB; cr++) etat.planning[aedActif][ctx.cibleJour][cr] = ctx.pid;
  sauver(); rendre();
}

document.getElementById("contenu").addEventListener("mousedown", (e) => {
  const td = e.target.closest("td.creneau");
  if (!td) return;
  e.preventDefault();
  const jour = td.dataset.jour, cr = +td.dataset.cr;
  const maintenant = Date.now();
  const bloc = blocAutour(aedActif, jour, cr);
  // Détection manuelle du double-clic : la grille étant redessinée à chaque clic,
  // l'événement dblclick natif ne se déclenche pas de façon fiable.
  if (maintenant - dernierClic.t < 450 && dernierClic.jour === jour && Math.abs(dernierClic.cr - cr) <= 2) {
    if (clicheAvant) {
      const s = JSON.parse(clicheAvant); // annule le coup de pinceau du 1er clic
      etat.planning = s.p; etat.indispos = s.i; lierPlanning();
      pileAnnuler.pop(); // retire l'entrée d'historique du 1er clic
    }
    peinture = false; debutPeinture = null; dernierPeint = null; deplacementBloc = null; nettoyerCibleDeplacement();
    dernierClic = { t: 0, jour: null, cr: -1 };
    sauver(); rendre();
    ouvrirSaisie(jour, cr);
    return;
  }
  dernierClic = { t: maintenant, jour, cr };
  if (bloc && !gomme && !outilIndispo) {
    clicheAvant = null;
    const largeur = bloc.b - bloc.a;
    const offset = cr - bloc.a;
    deplacementBloc = {
      ...bloc,
      jourOrigine: bloc.jour,
      largeur,
      offset,
      cibleJour: bloc.jour,
      cibleA: bloc.a,
      cibleB: bloc.b,
      deplace: false,
      snap: instantane(),
    };
    marquerCibleDeplacement();
    return;
  }
  clicheAvant = instantane();
  pousserHistorique(clicheAvant);
  peinture = true;
  debutPeinture = { jour, cr };
  dernierPeint = { jour, cr };
  poser(aedActif, jour, cr);
});
document.getElementById("contenu").addEventListener("mouseover", (e) => {
  if (deplacementBloc) {
    const td = e.target.closest("td.creneau");
    if (!td) return;
    const jour = td.dataset.jour, cr = +td.dataset.cr;
    const a = Math.max(0, Math.min(NB - deplacementBloc.largeur, cr - deplacementBloc.offset));
    deplacementBloc.cibleJour = jour;
    deplacementBloc.cibleA = a;
    deplacementBloc.cibleB = a + deplacementBloc.largeur;
    deplacementBloc.deplace = deplacementBloc.deplace || jour !== deplacementBloc.jourOrigine || a !== deplacementBloc.a;
    marquerCibleDeplacement();
    return;
  }
  if (!peinture) return;
  const td = e.target.closest("td.creneau");
  if (!td) return;
  const jour = td.dataset.jour, cr = +td.dataset.cr;
  if (dernierPeint && dernierPeint.jour === jour)
    poserPlage(aedActif, jour, dernierPeint.cr, cr); // comble les crans sautés
  else
    poser(aedActif, jour, cr);
  dernierPeint = { jour, cr };
});
window.addEventListener("mouseup", () => {
  if (deplacementBloc) terminerDeplacementBloc();
  peinture = false; debutPeinture = null; dernierPeint = null;
});

// ---------- Infobulle horaire ----------
const bulle = document.getElementById("infobulle");
document.getElementById("contenu").addEventListener("mousemove", (e) => {

document.getElementById("contenu").addEventListener("mouseleave", () => (bulle.style.display = "none"));

// ---------- Saisie manuelle des horaires (double-clic) ----------
let modalCtx = null;
const crVersHeure = (cr) => {
  const m = H_DEBUT * 60 + cr * PAS;
  return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
};
const heureVersCr = (val) => {
  const [h, m] = val.split(":").map(Number);
  return Math.max(0, Math.min(NB, Math.round((h * 60 + m - H_DEBUT * 60) / PAS)));
};

function ouvrirSaisie(jour, cr) {
  const plan = (etat.planning[aedActif] || {})[jour] || {};
  const pid = plan[cr];
  if (pid) {
    // bloc existant : trouver son étendue
    let a = cr, b = cr;
    while (a > 0 && plan[a - 1] === pid) a--;
    while (b < NB - 1 && plan[b + 1] === pid) b++;
    ouvrirModal({ jour, a, b: b + 1, pid, edition: true });
  } else {
    // zone vide : création d'un bloc d'1h par défaut
    ouvrirModal({ jour, a: cr, b: Math.min(cr + PAR_H, NB), pid: posteActif, edition: false });
  }
}

function ouvrirModal(ctx) {
  modalCtx = ctx;
  document.getElementById("modal-titre").textContent =
    (ctx.edition ? "Modifier le bloc — " : "Nouveau bloc — ") + (etat.aeds.find((a) => a.id === aedActif)?.nom || "");
  document.getElementById("modal-jour").innerHTML =
    JOURS.map((j) => `<option${j === ctx.jour ? " selected" : ""}>${j}</option>`).join("");
  document.getElementById("modal-poste").innerHTML =
    etat.postes.map((p) => `<option value="${p.id}"${p.id === ctx.pid ? " selected" : ""}>${ech(p.nom)}</option>`).join("");
  document.getElementById("modal-debut").value = crVersHeure(ctx.a);
  document.getElementById("modal-fin").value = crVersHeure(ctx.b);
  document.getElementById("modal-erreur").textContent = "";
  document.getElementById("modal-supprimer").style.display = ctx.edition ? "" : "none";
  document.getElementById("voile").classList.add("ouvert");
}
function fermerModal() {
  document.getElementById("voile").classList.remove("ouvert");
  modalCtx = null;
}
function effacerPlage(jour, a, b) {
  const plan = (etat.planning[aedActif] || {})[jour];
  if (plan) for (let cr = a; cr < b; cr++) delete plan[cr];
}
function validerModal() {
  if (!modalCtx) return;
  const jour = document.getElementById("modal-jour").value;
  const pid = document.getElementById("modal-poste").value;
  const a = heureVersCr(document.getElementById("modal-debut").value || "");
  const b = heureVersCr(document.getElementById("modal-fin").value || "");
  if (!(b > a)) {
    document.getElementById("modal-erreur").textContent = "L'heure de fin doit être après le début (entre 7h30 et 18h30).";
    return;
  }
  pousserHistorique();
  assurerDerogation();
  if (modalCtx.edition) effacerPlage(modalCtx.jour, modalCtx.a, modalCtx.b);
  if (!etat.planning[aedActif]) etat.planning[aedActif] = {};
  if (!etat.planning[aedActif][jour]) etat.planning[aedActif][jour] = {};
  for (let cr = a; cr < b; cr++)
    if (!estIndispo(aedActif, jour, cr)) etat.planning[aedActif][jour][cr] = pid;
  sauver(); rendre(); fermerModal();
}
document.getElementById("modal-supprimer").addEventListener("click", () => {
  if (!modalCtx) return;
  pousserHistorique();
  assurerDerogation();
  if (modalCtx.edition) effacerPlage(modalCtx.jour, modalCtx.a, modalCtx.b);

});
document.getElementById("voile").addEventListener("mousedown", (e) => {
  if (e.target.id === "voile") fermerModal();

window.addEventListener("keydown", (e) => {
  if (e.key === "Escape") fermerModal();

});

document.getElementById("titre").addEventListener("input", (e) => {
